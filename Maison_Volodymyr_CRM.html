<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Maison Volodymyr · CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f0e6;--card:#fffdf8;--soft:#f9f3e7;--ink:#2a1a1c;--mute:#7d6e68;--line:#eadfcb;--acc:#6b1620;--acc2:#8f2433;--gold:#b8913f;--gold2:#e2c378;--ok:#2f7d4e;--bad:#b3392f;--sh:0 1px 2px rgba(60,20,20,.05),0 10px 28px rgba(60,20,20,.07);--r:16px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140a0b;--card:#201213;--soft:#2a1717;--ink:#f3e9d8;--mute:#b3a093;--line:#3b2321;--acc:#a1303d;--acc2:#c04656;--gold:#d4b062;--gold2:#e8cf8e;--ok:#5bb97d;--bad:#e5695e;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#140a0b;--card:#201213;--soft:#2a1717;--ink:#f3e9d8;--mute:#b3a093;--line:#3b2321;--acc:#a1303d;--acc2:#c04656;--gold:#d4b062;--gold2:#e8cf8e;--ok:#5bb97d;--bad:#e5695e;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(700px 360px at 95% -8%,rgba(184,145,63,.16),transparent),radial-gradient(560px 380px at -6% 6%,rgba(107,22,32,.1),transparent)}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0;letter-spacing:.2px}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--gold);text-decoration:none;font-weight:500}a:hover{text-decoration:underline}
kbd{font:600 11px Inter,system-ui,sans-serif;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mute)}

/* layout */
#app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
#side{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px 16px;background:linear-gradient(185deg,#521018,#2b0709 75%);color:#f3e9d8;display:flex;flex-direction:column;gap:3px}
.brand{display:flex;gap:12px;align-items:center;padding:2px 10px 20px}
.logo{width:44px;height:44px;border-radius:50%;flex:none;background:#3a0a10;border:2px solid var(--gold2);color:#f3e9d8;display:grid;place-items:center;font:600 20px "Cormorant Garamond",Georgia,serif;box-shadow:0 0 0 4px rgba(226,195,120,.15)}
.brand b{display:block;font:600 22px/1.05 "Cormorant Garamond",Georgia,serif}.brand small{color:#d4b062;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;border-radius:12px;background:none;color:#e6d9c3;text-align:left;font-weight:500;transition:.18s}
.nv:hover{background:rgba(255,255,255,.08)}
.nv.on{background:linear-gradient(135deg,#e2c378,#c19b4a);color:#2c1606;font-weight:600;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.nv .i{width:24px;text-align:center;font-size:18px}.nv .bd{margin-left:auto;font-size:11px;font-weight:700;background:#e2c378;color:#2c1606;border-radius:99px;padding:1px 8px}.nv.on .bd{background:#521018;color:#f3e9d8}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);display:grid;gap:3px}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
#top .logo{display:none;width:38px;height:38px;font-size:17px}
#top .tt{font:600 22px "Cormorant Garamond",Georgia,serif;display:none}
#top .date{color:var(--mute);font-size:13px}
.sp{flex:1}
.pill{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}.pill:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}.pill.bad{color:var(--bad)}.pill.bad:before{background:var(--bad)}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:17px}
#view{max-width:1120px;margin:0 auto;padding:24px 28px 70px}
#tabbar{display:none}

/* typography & blocks */
h2{font-size:36px;line-height:1.1}
.ph{display:flex;align-items:center;gap:12px;margin:2px 0 16px;flex-wrap:wrap}.ph .sp{flex:1}
.sub{color:var(--mute);font-size:13px}
.card,.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.box{padding:18px;margin:0 0 14px}.box>.bt{font:600 23px "Cormorant Garamond",Georgia,serif;display:flex;align-items:center;gap:8px;margin-bottom:8px}.box>.bt .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:0}
.g2>.box{margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;position:relative;overflow:hidden;cursor:pointer;transition:.2s}
.kpi:hover{transform:translateY(-2px)}
.kpi:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--acc),var(--gold))}
.kpi span{display:block;color:var(--mute);font-size:13px}.kpi b{display:block;font:600 34px/1.15 "Cormorant Garamond",Georgia,serif}
.kpi.pos b,.pl{color:var(--ok)}.kpi.neg b,.mi{color:var(--bad)}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 28px;margin-bottom:14px;color:#f6ead5;background:radial-gradient(520px 240px at 100% 0,rgba(226,195,120,.28),transparent),linear-gradient(125deg,#3a0a10,#6b1620 62%,#4a0d12);box-shadow:0 18px 40px rgba(74,13,18,.28)}
.hero small{letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);font-size:12px}
.hero .big{font:600 58px/1.05 "Cormorant Garamond",Georgia,serif;margin:4px 0}
.hero p{margin:0 0 16px;color:#e8d8bd}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 18px;font-weight:600;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 14px rgba(107,22,32,.22);transition:.18s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.gold{color:#2c1606;background:linear-gradient(135deg,#f0d68e,#d9b45a);box-shadow:0 6px 16px rgba(0,0,0,.2)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.glass{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}.btn.lg{padding:14px 22px;font-size:16px;border-radius:14px;width:100%}
.btn.danger{color:var(--bad)}
.ico{border:0;background:none;color:var(--mute);width:32px;height:32px;border-radius:10px;font-size:15px}.ico:hover{background:var(--soft);color:var(--ink)}
.chip{border:0;border-radius:99px;padding:3px 11px;font-weight:600;font-size:12px;color:#fff;white-space:nowrap}
button.chip:hover{filter:brightness(1.1)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags>*{font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--mute)}.tags a{color:var(--gold)}.tags .g{color:var(--ok)}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px;margin-bottom:14px;max-width:100%;overflow:auto}
.seg button{border:0;background:none;padding:8px 16px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mute);white-space:nowrap}.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:500}.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;gap:10px;margin-bottom:14px}.bar input{flex:1}
label{display:block;font-size:12px;font-weight:500;color:var(--mute);margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,145,63,.22)}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 12px}
.row .w{grid-column:1/-1}
.note{color:var(--mute);font-size:13px;margin-top:8px;white-space:pre-wrap}
.empty{text-align:center;color:var(--mute);padding:40px 16px}.empty .em{font-size:40px;display:block;margin-bottom:6px}
.hot{color:var(--bad);font-weight:600}

/* list rows */
.li{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:var(--r);box-shadow:var(--sh);transition:.18s}
.li.click{cursor:pointer}.li.click:hover{transform:translateY(-2px)}
.li .gr{flex:1;min-width:0}.li .tp{display:flex;justify-content:space-between;gap:10px;align-items:center}.li .tp b{font-size:15.5px}
.li .acts{display:flex;flex:none;margin:-6px -8px 0 0}
.li[data-p="Высокая"]{border-left-color:var(--bad)}.li[data-p="Средняя"]{border-left-color:#d4a23a}.li[data-p="Низкая"]{border-left-color:var(--ok)}
.li.done{opacity:.6}
.amt{font:600 20px "Cormorant Garamond",Georgia,serif;white-space:nowrap}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--gold));color:#fff;font:600 22px "Cormorant Garamond",Georgia,serif}
.dh{display:flex;justify-content:space-between;align-items:baseline;font:600 22px "Cormorant Garamond",Georgia,serif;margin:20px 2px 8px}.dh small{font:500 13px Inter,sans-serif;color:var(--mute)}
.dt{width:54px;flex:none;text-align:center;border-radius:14px;background:var(--soft);border:1px solid var(--line);padding:6px 0}.dt b{display:block;font:600 24px/1 "Cormorant Garamond",Georgia,serif}.dt span{font-size:11px;color:var(--mute);text-transform:uppercase}
.task{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}.task:last-child{border:0}.task .ti{font-size:20px;width:28px;text-align:center}.task .tx{flex:1;min-width:0}
.warn{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--gold) 14%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:var(--r);padding:12px 16px;margin-bottom:14px}.warn span{flex:1;font-size:14px}

/* charts */
.chart{display:flex;align-items:flex-end;gap:4px;height:140px;margin-top:10px}.chart i{flex:1;background:linear-gradient(var(--gold),var(--acc));border-radius:5px 5px 0 0;min-height:3px;opacity:.92}.chart i:hover{opacity:1}
.lab{display:flex;gap:4px;font-size:10px;color:var(--mute);margin-top:4px}.lab span{flex:1;text-align:center}
.bars>div{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;align-items:center;gap:10px;margin:9px 0;font-size:13px}.bars span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bars i{display:block;height:9px;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--gold))}.bars em{font-style:normal;font-weight:600}
.fun{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.fun div{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}.fun b{display:block;font:600 28px/1.1 "Cormorant Garamond",Georgia,serif}.fun span{font-size:11.5px;color:var(--mute)}
.mn{display:flex;align-items:center;gap:10px;margin-bottom:14px}.mn b{font:600 26px "Cormorant Garamond",Georgia,serif;min-width:180px;text-align:center}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.mini div{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}.mini b{display:block;font:600 21px "Cormorant Garamond",Georgia,serif}.mini span{font-size:11px;color:var(--mute)}
.hist{border-left:2px solid var(--gold);margin:6px 0 6px 6px;padding:2px 0 2px 14px;position:relative}.hist:before{content:"";position:absolute;left:-7px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--gold)}

/* POS */
.pwrap{display:grid;grid-template-columns:1fr 410px;gap:18px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 10px 16px;box-shadow:var(--sh);text-align:center;transition:.15s;user-select:none}
.tile:hover{transform:translateY(-3px);border-color:var(--gold)}.tile:active{transform:scale(.95)}
.tile.in{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--card))}
.tile .e{font-size:34px;display:block}.tile b{display:block;font:600 18px/1.15 "Cormorant Garamond",Georgia,serif;margin-top:2px}.tile small{color:var(--mute)}
.tile kbd{position:absolute;top:8px;left:8px}.tile .q{position:absolute;top:8px;right:8px;background:var(--acc);color:#fff;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px}
.cart{position:sticky;top:76px;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:18px}
.cart .ch{display:flex;align-items:center;justify-content:space-between}.cart .cx{display:none}
.ln{display:grid;grid-template-columns:1fr auto 66px 62px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.ln input{padding:5px 7px;border-radius:9px}.ln .nm{padding:5px 8px}
.ln .z{border-color:var(--bad)}
.qc{display:flex;align-items:center;gap:6px;white-space:nowrap}.qc button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--soft);padding:0}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 4px}.tot b{font:600 46px/1 "Cormorant Garamond",Georgia,serif;color:var(--gold)}
.cartbar{display:none}
details.dd{border:1px solid var(--line);border-radius:12px;margin-top:12px;background:var(--soft)}details.dd summary{padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer}details.dd .in{padding:0 14px 14px}


/* ===== Paris house ===== */
.paris{position:relative;overflow:hidden;border-radius:26px;margin:0 0 16px;padding:104px 0 0;background:linear-gradient(180deg,#0b0311 0%,#240a26 32%,#5d1b35 70%,#a04e44 100%);box-shadow:0 24px 60px rgba(40,6,20,.42);isolation:isolate;border:1px solid rgba(226,195,120,.28)}
.sky{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sky>i{position:absolute;width:var(--s,2px);height:var(--s,2px);border-radius:50%;background:#fff;opacity:.85;animation:tw 3.4s ease-in-out infinite alternate;animation-delay:var(--d)}
.moon{position:absolute;right:7%;top:30px;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 34% 32%,#fffdf0,#f4e4b4 58%,#d8bf7c);box-shadow:0 0 46px 12px rgba(255,240,190,.38),0 0 150px 56px rgba(255,214,140,.14)}
.moon:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 62% 60%,rgba(170,140,80,.28) 0 9px,transparent 10px),radial-gradient(circle at 30% 66%,rgba(170,140,80,.22) 0 6px,transparent 7px)}
.eif{position:absolute;left:0;bottom:34px;height:76%;width:auto;filter:drop-shadow(0 0 12px rgba(226,195,120,.35))}
.skyl{position:absolute;left:0;bottom:26px;width:100%;height:96px}
.fac{position:relative;width:min(94%,840px);margin:0 auto}
.chs{position:absolute;left:0;right:0;top:-66px;height:110px;z-index:0}
.ch{position:absolute;bottom:0;width:38px;height:80px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 2px,transparent 2px 10px),linear-gradient(90deg,#7a382a,#ad5c44 48%,#68301f);border-radius:2px}
.ch:before{content:"";position:absolute;left:-5px;right:-5px;top:-9px;height:10px;background:linear-gradient(#5a2a1e,#3b1a13);border-radius:3px}
.ch:after{content:"";position:absolute;left:6px;right:6px;top:-24px;height:16px;background:linear-gradient(90deg,#8b4a35,#c07052,#8b4a35);border-radius:6px 6px 2px 2px}
.ch>i{position:absolute;left:8px;top:-34px;width:22px;height:22px;border-radius:50%;background:rgba(246,236,217,.6);filter:blur(2px);animation:smoke 5s ease-out infinite;animation-delay:calc(var(--s)*1.6s)}
.ridge{position:relative;z-index:3;height:11px;margin:0 8%;background:linear-gradient(#f4dc98,#a98535);border-radius:6px 6px 0 0;box-shadow:0 -2px 12px rgba(226,195,120,.35)}
.cat{position:absolute;z-index:4;left:27%;top:-33px;width:38px;height:38px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.cat .tail{transform-origin:6px 34px;animation:sway 3.4s ease-in-out infinite alternate}
.mans{position:relative;z-index:2;height:214px;margin:0 3%;clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);background:radial-gradient(circle at 50% 100%,transparent 0 9px,rgba(255,255,255,.07) 9px 10px) 0 0/24px 15px,repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 2px,transparent 2px 30px),linear-gradient(#58536f,#2e2a43 78%,#241f36);display:grid;grid-template-columns:repeat(3,1fr);gap:8%;align-items:end;padding:0 12%}
.cor{position:relative;z-index:3;height:26px;margin:0 .8%;background:linear-gradient(#f8eed6,#d9c69c);box-shadow:0 10px 18px rgba(0,0,0,.4);border-radius:2px}
.cor:after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:repeating-linear-gradient(90deg,#b49e70 0 6px,transparent 6px 11px)}
.cor.sm{height:17px}.cor.sm:after{height:6px}
.cor.lights:before{content:"";position:absolute;left:3%;right:3%;bottom:-9px;height:8px;z-index:2;background:radial-gradient(circle,#ffe9a8 0 2.5px,transparent 3.5px) 0 0/26px 8px repeat-x;filter:drop-shadow(0 0 4px #ffd166);animation:tw 2.6s ease-in-out infinite alternate}
.fl{position:relative;z-index:1;padding:30px 8% 0;background:repeating-linear-gradient(0deg,rgba(110,80,40,.12) 0 1px,transparent 1px 42px),linear-gradient(90deg,#d6c29a,#f3e6c9 11%,#f8eed8 50%,#f3e6c9 89%,#d6c29a);box-shadow:inset 0 22px 30px -20px rgba(0,0,0,.3)}
.fl:before,.fl:after{content:"";position:absolute;top:0;bottom:0;width:3.2%;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 42px),linear-gradient(90deg,#c9b489,#eadcbc 60%,#bda779);box-shadow:inset -3px 0 6px rgba(0,0,0,.12)}
.fl:before{left:1%}.fl:after{right:1%;transform:scaleX(-1)}
.fr{display:grid;grid-template-columns:repeat(3,1fr);gap:7%;position:relative;z-index:1}
.rail{position:relative;z-index:1;height:38px;margin:0 -5%;background:linear-gradient(#1c1013,#1c1013) top/100% 5px no-repeat,linear-gradient(#b8913f,#b8913f) 0 5px/100% 2px no-repeat,radial-gradient(circle at 50% 56%,transparent 6px,#1c1013 6.6px 8.2px,transparent 8.8px) 0 6px/30px 28px repeat-x,repeating-linear-gradient(90deg,#1c1013 0 2px,transparent 2px 15px) 0 6px/100% 28px no-repeat;border-bottom:4px solid #1c1013}
.fbox{position:absolute;left:-3%;right:-3%;bottom:34px;height:13px;border-radius:3px;background:linear-gradient(#6b3a24,#432316);z-index:2}
.fbox:before{content:"";position:absolute;left:3%;right:3%;top:-10px;height:12px;background:radial-gradient(circle,#e0455b 0 3.5px,transparent 4.5px) 0 0/16px 12px repeat-x,radial-gradient(circle,#3f8a4e 0 4px,transparent 5px) 8px 5px/16px 12px repeat-x}

 const chips=['',...Object.keys(GR)].map(k=>`<button class="${k==GF?'on':''}" onclick="GF='${k}';render()">${k?GR[k]:'Все'}</button>`).join('');
 let mh='';
 const out=occ().filter(x=>!GF||x.g==GF).map(x=>{const m=monthName(x.d),h=m!=mh?`<div class="dh"><span>${m}</span></div>`:'';mh=m;const dn=dd(x.d),p=dn-x.p,dt=new Date(x.d+'T00:00:00'),ek=encodeURIComponent(x.k),st=D.hs[x.k]||'План';
  return h+`<div class="li ${st=='Готово'?'done':''}"><div class="dt"><b>${dt.getDate()}</b><span>${dt.toLocaleDateString('ru',{month:'short'})}</span></div><div class="gr"><div class="tp"><b>${esc(x.t)}</b><button class="chip" style="background:${COL[HS.indexOf(st)]}" onclick="hc('${ek}')">${st}</button></div><div class="tags"><span>${GR[x.g]}</span><span class="${dn>=0&&p<=0&&st=='План'?'hot':''}">${dn<0?'прошёл':dn==0?'сегодня':'через '+dn+' дн.'}${dn>0?(p<=0?' · ПОРА ЗАПУСКАТЬ':' · старт через '+p+' дн.'):''}</span><a href="#" onclick="gen('${x.d}');return false">✨ Рассылка</a></div><input placeholder="Что продаём / какой набор…" value="${esc(D.hn[x.k]||'')}" oninput="hn('${ek}',this.value)" style="margin-top:10px"></div>${x.id?`<div class="acts"><button class="ico" onclick="delE('${x.id}')">×</button></div>`:''}</div>`}).join('');
 return head+`<div class="chips">${chips}</div><button class="btn ghost" style="margin-bottom:14px" onclick="openEv()">＋ Свой повод</button>${out}<div class="note">Даты мусульманских праздников приблизительные (≈): зависят от лунного календаря, уточняй ближе к дате. Нажми на статус, чтобы переключить: План → Готовим → Идёт → Готово.</div>`}
function cp(i){navigator.clipboard?.writeText(TPL[i][1]+SG);toast('Скопировано ✓')}
function gen(d){const h=occ().find(o=>o.d==d);if(!h)return;const tp=TPL.find(a=>h.t.includes(a[0])),txt=(tp?tp[1]:`🎁 Une belle occasion approche ! Offrez un cadeau personnalisé avec vos plus belles photos : mug, magnet, cadre photo ou coffret. Écrivez-nous pour découvrir nos idées !`)+SG;
 modal(`<h2>Рассылка: ${esc(h.t.split(' · ')[0])}</h2><div class="note">Текст на французском, его можно править. Отправляй только клиентам, которые дали согласие.</div><textarea id="gt" style="min-height:220px;margin-top:12px">${esc(txt)}</textarea><div class="foot"><button class="btn gold" onclick="window.open('https://wa.me/?text='+encodeURIComponent($('#gt').value),'_blank')">💬 Открыть в WhatsApp</button><button class="btn ghost" onclick="navigator.clipboard?.writeText($('#gt').value);toast('Скопировано ✓')">📋 Копировать</button></div>`)}

/* ---------- generic lists (catalog, promo, problems) ---------- */
function gv(k,seg){const s=S[k],o=s.f.find(f=>f[0]==s.st)[3];
 return `<div class="ph"><h2>${tab=='cat'?'Каталог':tab=='promo'?'Продвижение':s.n}</h2><span class="sp"></span><button class="btn" onclick="openItem('${k}')">＋ Добавить</button></div>${seg||''}
 <div class="bar"><input placeholder="Поиск…" value="${esc(q)}" oninput="q=this.value;$('#list').innerHTML=gl('${k}')"></div>
 <div class="chips">${['',...o].map(v=>`<button class="${v==XF?'on':''}" onclick="XF='${v}';render()">${v||'Все'}</button>`).join('')}</div><div id="list">${gl(k)}</div>`}
function gl(k){const s=S[k],a=s.f.find(f=>f[2]=='a'),o=s.f.find(f=>f[0]==s.st)[3],po={Высокая:0,Средняя:1,Низкая:2};
 let A=D[k].filter(x=>(!XF||x[s.st]==XF)&&(!q||JSON.stringify(x).toLowerCase().includes(q.toLowerCase()))).slice().reverse();
 A.sort((x,y)=>(DONE.includes(x[s.st])?1:0)-(DONE.includes(y[s.st])?1:0)||(k=='problems'?(po[x.prio]??3)-(po[y.prio]??3):0));
 return A.map(x=>{const mg=(k=='products'||k=='sets')&&num(x.price)&&num(x.cost);
  return `<div class="li ${DONE.includes(x[s.st])?'done':''}" data-p="${esc(x.prio||'')}"><div class="gr"><div class="tp"><b>${esc(x[s.m])}</b><button class="chip" style="background:${COL[Math.max(0,o.indexOf(x[s.st]))%4]}" onclick="cyc('${k}','${x.id}')">${esc(x[s.st])}</button></div><div class="tags">${s.f.filter(f=>f[0]!=s.m&&f[0]!=s.st&&f[2]!='a'&&x[f[0]]).map(f=>`<span>${L[f[0]]??''}${f[0]=='cost'?'себест. ':''}${f[0]=='date'?fd(x[f[0]]):esc(x[f[0]])}${f[0]=='price'||f[0]=='cost'?' €':''}</span>`).join('')}${mg?`<span class="g">маржа ${eur(x.price-x.cost)} (${Math.round((x.price-x.cost)/x.price*100)}%)</span>`:''}</div>${x[a[0]]?`<div class="note">${esc(x[a[0]])}</div>`:''}</div><div class="acts"><button class="ico" onclick="openItem('${k}','${x.id}')" title="Изменить">✎</button><button class="ico" onclick="del('${k}','${x.id}')" title="Удалить">×</button></div></div>`}).join('')||'<div class="empty"><span class="em">📭</span>Пока пусто — нажми «Добавить»</div>'}
function openItem(k,id){const s=S[k],x=id?D[k].find(a=>a.id==id):{};if(!x)return;
 modal(`<h2>${id?'Изменить':'Добавить'}</h2><div class="row">${s.f.map(([i,l,t,o])=>fld('i_'+i,l,t,x[i]??(t=='d'?today():(t=='s'?o[0]:'')),o)).join('')}</div><div class="foot"><button class="btn" onclick="saveItem('${k}','${id||''}')">Сохранить</button><button class="btn ghost" onclick="closeM()">Отмена</button></div>`);setTimeout(()=>$('#f_i_'+s.m)?.focus(),50)}
function saveItem(k,id){const s=S[k],o={};s.f.forEach(([i])=>o[i]=fv('i_'+i));if(!String(o[s.m]).trim()){$('#f_i_'+s.m).focus();return}
 if(id)Object.assign(D[k].find(a=>a.id==id),o);else D[k].push({id:uid(),...o});save();hideM();render();toast('Сохранено ✓')}
function cyc(k,id){const s=S[k],o=s.f.find(f=>f[0]==s.st)[3],x=D[k].find(a=>a.id==id);x[s.st]=o[(o.indexOf(x[s.st])+1)%o.length];save();render()}
function del(k,id){snap();D[k]=D[k].filter(a=>a.id!=id);save();render();toast('Удалено',1)}

/* ---------- backup ---------- */
function bk(){
 modal(`<h2>Резервная копия</h2><div class="note">Все данные хранятся в этом браузере. Если очистить браузер или сменить телефон, они пропадут — поэтому раз в неделю скачивай файл и храни его в облаке или мессенджере.</div>
 <div style="display:grid;gap:8px;margin-top:16px"><button class="btn lg gold" onclick="dlBk()">⬇ Скачать копию (файл)</button><button class="btn lg ghost" onclick="$('#impf').click()">⬆ Загрузить копию из файла</button><button class="btn lg ghost" onclick="navigator.clipboard?.writeText(JSON.stringify(D));D.lastBackup=today();save();toast('Скопировано ✓')">📋 Скопировать текстом</button></div>
 <div class="note">Если файл не скачивается, используй «Скопировать текстом» и вставь текст в заметки.</div>
 ${D.lastBackup?`<div class="note">Последняя копия: ${fd(D.lastBackup)}</div>`:''}
 <h3 class="serif">Восстановить из текста</h3><textarea id="bkt" placeholder="Вставь сюда скопированный текст копии" style="min-height:110px"></textarea><div class="foot"><button class="btn" onclick="rsText()">Восстановить</button></div>`)}
function dlBk(){D.lastBackup=today();save();dl(JSON.stringify(D),'maison-volodymyr-'+today()+'.json','application/json');toast('Копия скачана ✓')}
function restore(txt){let n;try{n=JSON.parse(txt);if(!n||typeof n!=='object'||Array.isArray(n))throw 0}catch(e){toast('Это не похоже на копию данных');return}
 ask('Заменить текущие данные данными из копии?',()=>{snap();D=n;norm();save();cur=null;hideM();render();toast('Данные восстановлены',1)},'bk()')}
function rsText(){restore($('#bkt').value)}
$('#impf').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>restore(r.result);r.readAsText(f);e.target.value=''});

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
 const ed=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName),open=$('#md').classList.contains('on');
 if(e.key=='Escape'){if(open)closeM();else modalCartOpen(0);return}
 if(open)return;
 if(tab=='pos'){if(e.key=='Enter'&&(!ed||e.target.id=='p_given'||e.target.id=='p_disc')){e.preventDefault();posSave()}
  else if(!ed){if(/^[1-9]$/.test(e.key)){const it=vis()[+e.key-1];if(it)posAdd(it.id)}else if(e.key=='Backspace'){P.cart=[];posU()}}}
 else if(!ed&&tab=='dash'&&/^[kKлЛ]$/.test(e.key))go('pos')});

render();
</script>
</body>
</html>
