    open && open.addEventListener('click', () => { const bk = b.id ? b : A.state.books.find(x => x.title === b.title); A.snd.page(); A.go('books'); setTimeout(() => { if (bk && bk.hasText) A.reader.open(bk, null); else if (bk) A.mods.books.openBook(bk.id); }, 1800); });
    if (!pvLoop) { pvLoop = 1; requestAnimationFrame(pvFrame); }
  }
  function clearTable() { tableVial = null; pvSteam.length = 0; if (scr) { A.$('#pvTable', scr).innerHTML = ''; A.$('#pvBtns', scr).classList.remove('on'); const c = A.$('#pvFx', scr); c.getContext('2d').clearRect(0, 0, c.width, c.height); } }
  const tintSprite = rgb => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32), m = rgb.map(v => Math.min(255, v + 60)).join(','); gr.addColorStop(0, `rgba(${m},.6)`); gr.addColorStop(.5, `rgba(${m},.22)`); gr.addColorStop(1, `rgba(${m},0)`); x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return c; };
  let smkS = null;
  let pvLast = 0;
  function pvFrame(now) {
    if (!scr) { pvLoop = 0; return; } requestAnimationFrame(pvFrame); const dt = Math.min(.05, (now - (pvLast || now)) / 1000); pvLast = now; if (A.scene.room() !== 'lab') return;
    const c = A.$('#pvFx', scr), g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height); if (!tableVial) return;
    const { wrap, TB, vW, vH } = tableVial, [tx, ty] = A.scene.plateToScreen(TB[0], TB[1]); wrap.style.transform = `translate3d(${(tx - vW / 2).toFixed(1)}px,${(ty - vH).toFixed(1)}px,0)`;
    const rgb = rgbOf(); if (Math.random() < dt * 9) pvSteam.push({ x: tx + R(-2, 2), y: ty - vH + 2, vx: R(-5, 5), vy: -R(22, 46), life: 0, max: R(2.6, 4.2), s: R(5, 11) });
    g.globalCompositeOperation = 'lighter';
    pvSteam = pvSteam.filter(q => { q.life += dt; if (q.life > q.max) return false; const k = q.life / q.max; q.x += (q.vx + Math.sin(q.life * 2.4 + q.max) * 14) * dt; q.y += q.vy * dt; const r = q.s * (1 + k * 4.2); g.globalAlpha = Math.min(1, k * 6) * (1 - k) * .3; g.drawImage(smkS, q.x - r, q.y - r, r * 2, r * 2); return true; });
    const gr = g.createRadialGradient(tx, ty - vH * .45, 0, tx, ty - vH * .45, vH * 1.3); gr.addColorStop(0, `rgba(${rgb},${.28 + .06 * Math.sin(performance.now() / 400)})`); gr.addColorStop(1, `rgba(${rgb},0)`); g.globalAlpha = 1; g.fillStyle = gr; g.fillRect(tx - vH * 1.4, ty - vH * 1.8, vH * 2.8, vH * 2.4); g.globalCompositeOperation = 'source-over';
  }

  function recommend() {
    const mine = A.state.books.filter(b => b.status === 'want'), have = new Set(A.state.books.map(b => b.title.toLowerCase()));
    const score = b => { const tg = b.tags || b.m || []; let s = 0; tg.forEach(m => { if (sel.has(m)) s += 3; }); return s + Math.random() * .9; };
    const own = mine.map(b => ({ b, s: score(b), own: true })).filter(x => x.s >= 1.5).sort((a, b) => b.s - a.s)[0];
    const cands = A.SUGGEST.filter(x => !have.has(x.t.toLowerCase())).map(x => ({ b: { title: x.t, author: x.a, pages: x.p, tags: x.m }, s: score(x) })).sort((a, b) => b.s - a.s);
    return own || cands[0] || { b: { title: A.SUGGEST[0].t, author: A.SUGGEST[0].a, pages: A.SUGGEST[0].p, tags: A.SUGGEST[0].m }, s: 0 };
  }
  function show() {}
})();

/* ============================================================ goals: daily pages -> acorns, week bars, stickers, logging + book completion */
A.goal = (() => {
  let el;
  const C = 2 * Math.PI * 42;
  const msgs = { zero: ['Страничка-другая перед сном? Лес подождёт.', 'Сегодня ещё тихо. Открой любимую книгу.', 'Чай, плед и пара страниц: самое время.'], part: ['Ещё {n} {w}, и желудь твой.', 'Отлично идёшь! Осталось {n} {w}.', 'Лес уже шепчет: ещё {n} {w}.'], done: ['Цель дня выполнена! Желудь в кармане.', 'Идеально. Можно читать дальше просто так.', 'Принцесса сегодня молодец ✨'] };
  const pick = a => a[Math.floor(Date.now() / 86400000) % a.length];
  function mount(root) {
    el = root; root.innerHTML = `<div class="goal glass"><div class="goal__top"><div class="ring"><svg viewBox="0 0 100 100"><defs><linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0bf"/><stop offset="1" stop-color="#f1a94b"/></linearGradient></defs><circle cx="50" cy="50" r="42" class="ring__bg"/><circle cx="50" cy="50" r="42" class="ring__fg" id="ringFg" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="ring__c"><b id="gToday">0</b><small>из <span id="gGoal">20</span> стр.</small></div></div>
      <div class="goal__txt"><div class="eyebrow">сегодня</div><p class="goal__msg" id="gMsg"></p><button class="btn btn--gold goal__btn" id="gLog"><svg class="ico" viewBox="0 0 24 24"><use href="#i-plus"/></svg>Записать страницы</button></div></div></div>`;
    A.$('#gLog', root).addEventListener('click', () => { A.snd.tap(); logSheet(); });
    refresh();
  }
  function refresh() {
    if (!el) return; const g = A.state.goal, t = A.pagesToday(), p = Math.min(1, t / g.day);
    A.$('#gToday', el).textContent = t; A.$('#gGoal', el).textContent = g.day;
    A.$('#ringFg', el).setAttribute('stroke-dashoffset', C * (1 - p));
    const left = Math.max(0, g.day - t);
    A.$('#gMsg', el).textContent = t === 0 ? pick(msgs.zero) : left > 0 ? pick(msgs.part).replace('{n}', left).replace('{w}', A.plural(left, 'страница', 'страницы', 'страниц')) : pick(msgs.done);
    A.refreshHud();
  }
  function animateIn() { if (!el) return; const f = A.$('#ringFg', el), v = f.getAttribute('stroke-dashoffset'); f.style.transition = 'none'; f.setAttribute('stroke-dashoffset', C); void f.getBoundingClientRect(); f.style.transition = ''; requestAnimationFrame(() => f.setAttribute('stroke-dashoffset', v)); }

  function logSheet(preBook) {
    const reading = A.state.books.filter(b => b.status === 'reading'), first = preBook || (reading[0] && reading[0].id) || '';
    let n = 10, sel = first;
    A.sheet.open({ title: 'Сколько страниц?', html: `<div class="eyebrow" style="margin-bottom:10px">что читала</div><div class="chips" id="lgBooks" style="margin-bottom:14px">${reading.map(b => `<button class="chip ${b.id === sel ? 'on' : ''}" data-id="${b.id}">${A.esc(b.title)}</button>`).join('')}<button class="chip ${!sel ? 'on' : ''}" data-id="">без книги</button></div>
      <div class="bigstep"><button id="lgM" aria-label="Меньше">−</button><div><b id="lgN">10</b><small>страниц</small></div><button id="lgP" aria-label="Больше">+</button></div>
      <div class="chips" style="justify-content:center;margin:6px 0 20px;padding-bottom:0">${[5, 10, 20, 30, 50].map(v => `<button class="chip" data-q="${v}">+${v}</button>`).join('')}</div>
      <button class="btn btn--gold" style="width:100%" id="lgOk">Записать в дневник</button>`, onMount: s => {
        const q = x => A.$(x, s.el), upd = () => { q('#lgN').textContent = n; };
        A.$$('#lgBooks .chip', s.el).forEach(c => c.addEventListener('click', () => { sel = c.dataset.id; A.$$('#lgBooks .chip', s.el).forEach(x => x.classList.toggle('on', x === c)); A.snd.tap(); }));
        q('#lgM').addEventListener('click', () => { n = Math.max(1, n - 1); upd(); A.snd.tap(); }); q('#lgP').addEventListener('click', () => { n = Math.min(500, n + 1); upd(); A.snd.tap(); });
        A.$$('[data-q]', s.el).forEach(c => c.addEventListener('click', () => { n = Math.min(500, n + +c.dataset.q); upd(); A.snd.twinkle(n % 5); }));
        q('#lgOk').addEventListener('click', () => { s.close(); setTimeout(() => A.logPages(n, sel), 350); });
      } });
  }

  function acornSheet() {
    const st = A.state, open = A.stickersOpen().length;
    A.sheet.open({ title: 'Желуди и стикеры', tall: true, html: `<div class="glass" style="padding:18px;display:flex;align-items:center;gap:16px;margin-bottom:16px"><svg viewBox="0 0 24 24" style="width:46px;height:46px;color:#d9a05b;fill:currentColor"><use href="#i-acorn"/></svg><div><div style="font:200 34px/1 var(--f)">${st.acorns}</div><div class="sub" style="font-size:15px">всего собрано ${st.earned}</div></div></div>
      <p class="sub" style="margin-bottom:14px;font-size:15px">Желудь за каждые 10 страниц, +5 за цель дня, +15 за неделю и +15 за законченную книгу. Новые стикеры открываются сами и пригодятся для открыток.</p>
      <div class="sec__h"><h3>Стикеры</h3><small>${open} из ${A.STICKERS.length}</small></div><div class="stk">${A.STICKERS.map(s => { const ok = st.earned >= s.at; return `<div class="stk__i ${ok ? 'ok' : ''}"><span>${ok ? s.e : '🔒'}</span><small>${ok ? s.n : s.at + ' 🌰'}</small></div>`; }).join('')}</div>` });

})();

A.finishBook = (b, silent) => {
  if (b.status === 'done' && b.finished) return; b.status = 'done'; b.finished = Date.now(); if (b.pages) b.read = b.pages;
  const first = !b.rewarded; b.rewarded = true; A.save(); if (silent) return; if (first) A.addAcorns(15);
  A.snd.unlock2(); A.vibrate([40, 30, 60]); A.fx.petals(innerWidth / 2, innerHeight * .55, 36); A.fx.stars(innerWidth / 2, innerHeight * .4, 24);
  A.toast(`«${b.title}» прочитана. На небе зажглась новая звезда`, 3600);
  A.mods.sky && A.mods.sky.markNew && A.mods.sky.markNew(b.id);
};
A.logPages = (n, bookId) => {
  if (!(n > 0)) return; const st = A.state, key = A.dayKey(), oldTotal = A.pagesTotal(), oldDay = A.pagesToday(), oldWeek = A.pagesWeek();
  st.log[key] = (st.log[key] || 0) + n;
  let finished = null;
  if (bookId) { const b = A.bookById(bookId); if (b) { b.read = Math.min(b.pages || 1e9, (b.read || 0) + n); if (b.status === 'want') b.status = 'reading'; if (b.pages && b.read >= b.pages) finished = b; } }
  const gain = Math.floor((oldTotal + n) / 10) - Math.floor(oldTotal / 10); if (gain > 0) A.addAcorns(gain);
  A.snd.coin(); A.fx.float(innerWidth / 2, innerHeight * .45, `+${n} стр.`); A.vibrate(15);
  if (oldDay < st.goal.day && A.pagesToday() >= st.goal.day && !st.claimedDays[key]) { st.claimedDays[key] = 1; A.addAcorns(5); A.fx.acornRain(); setTimeout(() => { A.snd.chime([659.25, 783.99, 987.77, 1318.5], .1); A.toast('Цель дня выполнена! +5 желудей 🌰', 3200); }, 500); }
  const wk = A.weekId(); if (oldWeek < st.goal.week && A.pagesWeek() >= st.goal.week && !st.claimedWeeks[wk]) { st.claimedWeeks[wk] = 1; A.addAcorns(15); setTimeout(() => { A.fx.acornRain(40); A.toast('Цель недели выполнена! +15 желудей 🌰', 3600); }, 1800); }
  A.save(); if (finished) setTimeout(() => A.finishBook(finished), 600);
  A.goal.refresh(); A.refreshHud(true); A.mods.books && A.mods.books.refresh && A.mods.books.refresh();
  setTimeout(() => A.mods.path && A.mods.path.checkUnlock(), 1600);
};

/* ============================================================ the leather bag on the table: today's pages, acorns, stickers, settings */
(() => {
  let el;
  const mod = A.mods.bag = {
    init(root) {
      el = root;
      root.innerHTML = `<div class="wrap"><div data-rise><div class="eyebrow">сумка принцессы</div><h1 class="h1">Мои <em>мелочи</em></h1><p class="sub">Страницы за сегодня, желуди и стикеры для открыток.</p></div>
        <div id="goalMount" data-rise style="margin-top:22px"></div>
        <div class="bagrow" data-rise><button class="bagit" id="bgAc"><span>Желуди и стикеры</span><b><span id="acornN">0</span></b></button><button class="bagit" id="bgSet"><span>Настройки и копия</span><svg class="ico" viewBox="0 0 24 24"><use href="#i-sound"/></svg></button></div>
        <p class="sub bagnote" data-rise>Дней подряд: <b id="streakN">0</b></p><div style="height:40px"></div></div>`;
      A.goal.mount(A.$('#goalMount', root));
      A.$('#bgAc', root).addEventListener('click', () => { A.snd.tap(); A.goal.acornSheet(); });
      A.$('#bgSet', root).addEventListener('click', () => { A.snd.tap(); A.settings(); });
      A.refreshHud();
    },
    show() { A.rise(el); mod.refreshGoal(); A.goal.animateIn(); },
    refreshGoal() { A.goal.refresh(); }
  };
  A.mods.path && (A.mods.path.acornSheet = () => A.goal.acornSheet());
})();

/* ============================================================ the entrance: the flythrough (graveyard, the key, the gate opens, the candlelit hall) with its own sound.
   There is no button: the gate opens by itself and she walks into the room. Sound starts on the first touch (browsers forbid it earlier).
   Playback has two engines so the door can never silently be skipped:  a <video> of the film, and, if the browser cannot play it, the same film as an image sequence on a canvas with its audio on the side. */
A.introInit = () => A.intro = (() => {
  const el = A.$('#intro'), v = A.$('#introV'), skip = A.$('#introSkip'), sc = A.$('#introSeq'), sg = sc.getContext('2d'), amb = A.$('#introAmb'), ag = amb.getContext('2d');
  const DUR = 11.83, FPS = 12, N = 142, first = !A.state.introSeen, wantSound = () => A.state.settings.sound !== false;
  let done = false, played = false, soundOn = false, seq = false, tStart = 0, tFail = 0, frames = [], audio = null, ended = false, ambT = 0, lastDraw = -1;

  function finish() {
    if (done) return; done = true; clearTimeout(tFail);
    A.state.introSeen = true; A.save(); el.classList.add('out'); document.body.classList.add('ui');
    A.snd.setMood('room'); if (soundOn) A.snd.chime([392, 523.25, 659.25, 783.99], .16, .9);
    A.ui.enterApp(first);
    setTimeout(() => { try { v.pause(); audio && audio.pause(); } catch (e) {} el.hidden = true; }, 1800);
    setTimeout(() => { if (A.tab !== 'room') return; const h = A.$('#hint'); h.textContent = first ? 'Проведи пальцем, чтобы осмотреться. Коснись любого предмета.' : ''; h.classList.add('on'); setTimeout(() => h.classList.remove('on'), 6500); }, 3800);
  }
  function unmute() {
    if (soundOn || !wantSound()) return; soundOn = true; A.snd.unlock(); el.classList.add('snd');
    try { if (seq) { if (audio) { audio.currentTime = Math.min(DUR - .1, clock()); audio.volume = 1; audio.play().catch(() => {}); } } else { v.muted = false; v.volume = 1; if (v.paused && !done) v.play().catch(() => {}); } } catch (e) {}
  }
  const clock = () => seq ? Math.max(0, (performance.now() - tStart) / 1000) : v.currentTime;
  function begin() { if (played) return; played = true; clearTimeout(tFail); el.classList.add('play'); ambient(); setTimeout(() => el.classList.add('skippable'), 2600); }
  const endHold = () => { if (ended) return; ended = true; el.classList.add('title'); setTimeout(finish, 2100); };       // hold the last frame (the candlelit hall) with the title, then walk in

  /* landscape: the film is 9:16, so a tiny live copy of the frame, mirrored to both sides and blurred, is the light around it instead of black bars */
  function ambient() {
    if (done) return; requestAnimationFrame(ambient); if (innerWidth <= innerHeight) return; const src = seq ? sc : v; if (!seq && v.readyState < 2) return;
    const now = performance.now(); if (now - ambT < 60) return; ambT = now;
    const cw = 96, ch = Math.max(30, Math.round(96 * innerHeight / innerWidth)); if (amb.width !== cw || amb.height !== ch) { amb.width = cw; amb.height = ch; }
    const sw = seq ? sc.width : v.videoWidth, sh = seq ? sc.height : v.videoHeight, h = ch, w = sw * h / sh, n = Math.ceil(cw / w / 2) + 1;
    for (let i = -n; i <= n; i++) { ag.save(); ag.translate(cw / 2 + i * w, 0); if (i & 1) ag.scale(-1, 1); ag.drawImage(src, -w / 2, 0, w, h); ag.restore(); }
  }

  /* ---------------- engine 1: the video */
  v.addEventListener('playing', begin);
  v.addEventListener('timeupdate', () => { if (v.currentTime > v.duration - 2.6 && !el.classList.contains('title')) el.classList.add('title'); });
  v.addEventListener('ended', endHold);
  v.addEventListener('error', () => { if (!played) toSeq(); });
  function startVideo() {
    v.muted = !wantSound(); v.playsInline = true;
    tFail = setTimeout(() => { if (!played && v.readyState < 2) toSeq(); }, 4500);                  // nothing is moving after 4.5 s: switch engines
    const p = v.play(), mute = () => { v.muted = true; return v.play(); };
    if (p && p.then) p.then(() => { if (!v.muted) { soundOn = true; el.classList.add('snd'); } }).catch(err => mute().catch(() => {
      if (err && err.name !== 'NotAllowedError') return toSeq();
      el.classList.add('play'); const go = () => { v.play().catch(toSeq); unmute(); }; addEventListener('pointerdown', go, { once: true });  // autoplay is forbidden here: the first touch starts the film
    }));
  }

  /* ---------------- engine 2: image sequence + audio */
  function toSeq() {
    if (seq || done || played) return; seq = true; el.classList.add('seq'); clearTimeout(tFail); try { v.pause(); } catch (e) {}
    const url = i => `video/seq/f${String(i + 1).padStart(3, '0')}.webp`; let next = 0, ok = 0;
    const pull = () => { if (next >= N) return; const i = next++, im = new Image(); im.onload = () => { frames[i] = im; ok++; if (ok === 10 && !tStart) { tStart = performance.now(); el.classList.add('play'); begin(); requestAnimationFrame(tick); } pull(); }; im.onerror = () => { pull(); }; im.src = url(i); };
    for (let k = 0; k < 6; k++) pull();
    audio = new Audio('video/intro.mp3'); audio.preload = 'auto';
    tFail = setTimeout(() => { if (!tStart) finish(); }, 6000);                                         // not even the stills arrive: walk in anyway
  }
  function tick() {
    if (done) return; requestAnimationFrame(tick); const t = (performance.now() - tStart) / 1000, i = Math.min(N - 1, Math.floor(t * FPS));
    if (t > DUR - 2.6) el.classList.add('title'); if (t >= DUR) endHold();
    let j = i; while (j > 0 && !frames[j]) j--; if (!frames[j] || j === lastDraw) return; lastDraw = j;
    const im = frames[j]; if (sc.width !== im.naturalWidth) { sc.width = im.naturalWidth; sc.height = im.naturalHeight; } sg.drawImage(im, 0, 0);
  }

  skip.addEventListener('click', e => { e.stopPropagation(); A.snd.unlock(); finish(); });
  ['pointerdown', 'touchend', 'keydown'].forEach(t => addEventListener(t, () => { A.snd.unlock(); unmute(); }, { capture: true, passive: true }));

  if (!v.canPlayType || (!v.canPlayType('video/mp4') && !v.canPlayType('video/webm'))) toSeq(); else startVideo();
  return { finish, unmute, get done() { return done; }, get engine() { return seq ? 'seq' : 'video'; } };
})();

/* ============================================================ boot: the entrance video (intro.js) -> the hub room, the fire lights */
(() => {
  A.load(); A.txt.migrate();
  if (!A.state.books.length && !A.state.quotes.length && A.state.samples) A.seed();
  else if (A.state.seedV !== 2 && A.state.books.length && A.state.books.every(b => b.sample)) A.seed();      // an untouched older sample shelf becomes her own six books
  A.scene.init(); A.scene.start(); A.introInit();
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  A.debug = { enter: () => A.intro && A.intro.finish() };
})();

</script>
