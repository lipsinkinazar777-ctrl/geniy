<title>Уголок принцессы Айсель</title>
<meta name="description" content="Уютный лесной каталог книг: тропа, полка, цитаты, звёзды и зельеварня.">
<meta name="theme-color" content="#000000">

<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Уголок Айсель">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter+Tight:wght@200;300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&display=swap">
<style>
:root{--bg:#000;--ink:#f3ead3;--ink2:rgba(243,234,211,.68);--ink3:rgba(243,234,211,.42);--glass:rgba(10,14,14,.52);--glass2:rgba(14,20,19,.7);--line:rgba(255,226,160,.16);--gold:#f1c76e;--glow:#ffd98a;--teal:#38c2ae;--rose:#ffadc2;--moss:#4f8a5b;--parch:#ecdcb4;--ink-dark:#2b2114;
--f:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--hand:"Cormorant Garamond",Georgia,serif;
--ease:cubic-bezier(.22,.9,.24,1);--spring:cubic-bezier(.34,1.56,.64,1);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--navh:72px;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.5 var(--f);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer;padding:0}
input,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3,p{margin:0}
.ico{width:1.2em;height:1.2em;fill:none;stroke:currentColor}
[hidden]{display:none!important}
::selection{background:rgba(241,199,110,.35)}
#vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55))}
body.warm #vignette{background:radial-gradient(120% 90% at 50% 45%,transparent 50%,rgba(40,12,0,.55))}

/* ---------------- gate / walk / finale : cinematic, OLED black, gold hairline glass */
#gate,#walk,#finale{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;text-align:center}
#gate{justify-content:center;gap:18px;padding:0 30px;background:radial-gradient(90% 70% at 50% 50%,rgba(0,0,0,.28),rgba(0,0,0,.78));transition:opacity 1.3s var(--ease),visibility 1.3s,transform 1.8s var(--ease)}
#gate.out{opacity:0;visibility:hidden;transform:scale(1.14)}
.gate__small,.fin__small{font:italic 300 17px/1 var(--serif);letter-spacing:.34em;color:rgba(246,230,189,.7);text-transform:lowercase;opacity:0;animation:rise 1.8s .5s var(--ease) forwards}
.gate__title{font:300 clamp(40px,12.4vw,64px)/1.02 var(--serif);letter-spacing:.015em;text-wrap:balance;color:#f6e6bd;opacity:0;animation:rise 2s .9s var(--ease) forwards;text-shadow:0 0 1px rgba(255,235,190,.9),0 0 22px rgba(255,204,120,.5),0 0 60px rgba(255,180,80,.28)}
.gate__title em{display:block;font-style:italic;font-weight:400;color:#ffd98a;letter-spacing:.04em;margin-top:.04em;text-shadow:0 0 1px rgba(255,235,190,.9),0 0 26px rgba(255,190,90,.7),0 0 70px rgba(255,170,60,.4)}
.gate__title::after{content:"";display:block;width:84px;height:1px;margin:20px auto 0;background:linear-gradient(90deg,transparent,rgba(255,217,138,.9),transparent);box-shadow:0 0 14px rgba(255,200,110,.7)}
.gate__btn,.fin__btn{position:relative;margin-top:22px;display:inline-flex;align-items:center;justify-content:center;gap:14px;padding:18px 38px;border-radius:999px;background:rgba(6,9,9,.42);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);font:400 14px/1 var(--f);letter-spacing:.26em;text-transform:uppercase;color:#f8e8c0;opacity:0;box-shadow:0 14px 50px rgba(0,0,0,.55),0 0 36px rgba(255,200,110,.12),inset 0 1px 0 rgba(255,236,190,.14);transition:transform .5s var(--spring)}
.gate__btn{animation:rise 1.6s 1.6s var(--ease) forwards,breathe 4s 3.4s ease-in-out infinite}
.gate__btn::before,.fin__btn::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,rgba(255,226,160,.95),rgba(255,226,160,.14) 38%,rgba(255,226,160,.06) 60%,rgba(255,226,160,.6));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;box-shadow:0 0 18px rgba(255,200,110,.5)}
.gate__btn::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(110px 50px at var(--mx,50%) 130%,rgba(255,214,140,.35),transparent 70%);pointer-events:none}
.gate__btn span{position:relative}
.gate__btn:active,.fin__btn:active{transform:scale(.96)}
.gate__hint{font:300 12px/1 var(--f);letter-spacing:.24em;text-transform:uppercase;color:rgba(246,230,189,.38);opacity:0;animation:rise 1.6s 2.1s var(--ease) forwards}
@keyframes rise{from{opacity:0;transform:translateY(22px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes breathe{50%{box-shadow:0 14px 50px rgba(0,0,0,.55),0 0 56px rgba(255,200,110,.3),inset 0 1px 0 rgba(255,236,190,.14)}}
#walk{pointer-events:none;justify-content:flex-end;padding:0 28px calc(34px + var(--sab))}
#walk::before,#walk::after{content:"";position:absolute;left:0;right:0;height:11vh;background:#000;transition:transform 1.4s var(--ease)}
#walk::before{top:0;transform:translateY(-100%)}#walk::after{bottom:0;transform:translateY(100%)}
#walk.on::before,#walk.on::after{transform:none}
.walk__cap{font:italic 300 clamp(21px,6vw,27px)/1.3 var(--serif);letter-spacing:.03em;color:#f6e6bd;text-shadow:0 0 22px rgba(255,200,110,.45),0 2px 20px rgba(0,0,0,.8);min-height:2.6em;opacity:0;transition:opacity 1.1s,transform 1.6s var(--ease);transform:translateY(10px);position:relative;z-index:2;margin-bottom:11vh}
.walk__cap.on{opacity:1;transform:none}
.walk__skip{position:absolute;top:calc(var(--sat) + 16px);right:18px;pointer-events:auto;font:300 11px/1 var(--f);letter-spacing:.24em;text-transform:uppercase;color:rgba(246,230,189,.7);padding:11px 16px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,226,160,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:3}
#finale{justify-content:space-between;padding:calc(var(--sat) + 9vh) 26px calc(var(--sab) + 7vh);background:linear-gradient(180deg,rgba(0,0,0,.66),transparent 38%,transparent 62%,rgba(0,0,0,.6));opacity:0;transition:opacity 1.6s var(--ease)}
#finale.on{opacity:1}
.fin__head{display:flex;flex-direction:column;align-items:center}
.fin__title{font:300 clamp(36px,10.6vw,56px)/1.04 var(--serif);letter-spacing:.015em;margin-top:14px;color:#f6e6bd;text-shadow:0 0 1px rgba(255,235,190,.9),0 0 22px rgba(255,204,120,.5),0 0 60px rgba(255,180,80,.28)}
.fin__title em{display:block;font-style:italic;font-weight:400;color:#ffd98a;letter-spacing:.04em;text-shadow:0 0 1px rgba(255,235,190,.9),0 0 26px rgba(255,190,90,.7),0 0 70px rgba(255,170,60,.4)}
.fin__title .l{display:inline-block;opacity:0;transform:translateY(16px) scale(.92);filter:blur(8px);animation:letter 1.1s var(--ease) forwards}
@keyframes letter{to{opacity:1;transform:none;filter:none}}
.fin__btn{margin-top:0;transform:translateY(20px);transition:opacity 1.2s .2s,transform 1.2s .2s var(--ease)}
.fin__btn i{width:6px;height:6px;border-radius:50%;background:#ffd98a;box-shadow:0 0 12px 2px rgba(255,200,110,.9);animation:pingd 2.4s infinite}
@keyframes pingd{70%{box-shadow:0 0 0 12px rgba(255,200,110,0)}}
#finale.showbtn .fin__btn{opacity:1;transform:none}
.fin__title .w{display:inline-block;white-space:nowrap}

/* ---------------- app shell */
#app{position:fixed;inset:0;z-index:10}
.view{position:absolute;inset:0;padding:calc(var(--sat) + 78px) 0 calc(var(--navh) + var(--sab) + 28px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;visibility:hidden;pointer-events:none;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.active{visibility:visible;pointer-events:auto}
.wrap{padding:0 18px;max-width:560px;margin:0 auto}
.rise{opacity:0;transform:translateY(26px);filter:blur(6px);animation:rise2 .9s var(--ease) forwards;animation-delay:calc(var(--i,0)*70ms + 120ms)}
@keyframes rise2{to{opacity:1;transform:none;filter:none}}

/* ---------------- header */
.top{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 10px) 14px 10px;background:linear-gradient(180deg,rgba(3,10,8,.82),rgba(3,10,8,0));transform:translateY(-120%);transition:transform 1s var(--ease)}
body.ui .top{transform:none}
.medal{position:relative;width:46px;height:46px;border-radius:50%;flex:none;padding:3px;background:conic-gradient(from 200deg,#fff0bf,#e0a94b,#fff0bf,#b9812e,#fff0bf);box-shadow:0 0 22px rgba(255,200,110,.35)}
.medal__img{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe3d0,#e8a98e 55%,#7a4a40);background-size:cover;background-position:center;border:2px solid #0b1a16}
.medal__crown{position:absolute;left:50%;top:-9px;width:26px;transform:translateX(-50%) rotate(-6deg);color:#f1c76e;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.top__ttl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1}
.top__ttl small{font:italic 400 13px/1 var(--serif);letter-spacing:.12em;color:var(--ink2)}
.top__ttl b{font:400 30px/1.1 var(--hand);color:#ffe0a0;text-shadow:0 0 18px rgba(255,200,110,.45);margin-top:1px}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 9px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font:400 15px/1 var(--f);transition:transform .4s var(--spring)}
.pill .ico{width:18px;height:18px;fill:currentColor;stroke:none}
.pill .acorn{color:#d9a05b}.pill--fire .ico{color:#ff9a4d}
.pill:active{transform:scale(.92)}
.pill.bump{animation:bump .7s var(--spring)}
@keyframes bump{40%{transform:scale(1.25)}}

/* ---------------- tab bar */
.tabs{position:fixed;left:14px;right:14px;bottom:calc(var(--sab) + 12px);height:var(--navh);z-index:30;display:flex;border-radius:26px;background:rgba(7,22,19,.72);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,236,190,.1);transform:translateY(160%);transition:transform 1.1s .15s var(--ease);max-width:520px;margin:0 auto}
body.ui .tabs{transform:none}
.tabs button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink3);font:300 11px/1 var(--f);letter-spacing:.06em;transition:color .4s,transform .5s var(--spring);z-index:1}
.tabs button .ico{width:26px;height:26px;stroke-width:1.3;transition:transform .6s var(--spring),filter .4s}
.tabs button.on{color:#ffe3a6}
.tabs button.on .ico{transform:translateY(-3px) scale(1.12);filter:drop-shadow(0 0 8px rgba(255,200,110,.7))}
.tabs button:active{transform:scale(.9)}
.tabs__glow{position:absolute;top:6px;bottom:6px;left:0;width:20%;border-radius:20px;background:radial-gradient(80% 90% at 50% 20%,rgba(255,214,140,.28),rgba(255,214,140,.06) 70%);box-shadow:inset 0 0 0 1px rgba(255,226,160,.22);transition:transform .7s var(--spring);pointer-events:none}
.tabs__glow::after{content:"";position:absolute;left:50%;bottom:-3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#ffd98a;box-shadow:0 0 12px 3px rgba(255,200,110,.8)}

/* ---------------- iris */
#iris{position:fixed;z-index:60;left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;pointer-events:none;opacity:0;border:2px solid rgba(255,226,160,.9);box-shadow:0 0 50px 10px rgba(255,200,110,.45),inset 0 0 40px rgba(255,200,110,.4)}
#fx{position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%}

/* ---------------- glass, typography, buttons */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 14px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,236,190,.08)}
.eyebrow{font:400 11px/1 var(--f);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.h1{font:200 clamp(28px,8.4vw,38px)/1.08 var(--f);letter-spacing:-.02em}
.h1 em{font:400 1.25em/1 var(--hand);font-style:normal;color:#ffe0a0}
.sub{font:italic 400 17px/1.35 var(--serif);color:var(--ink2)}
.sec{margin-top:26px}
.sec__h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 12px}
.sec__h h3{font:300 20px/1.2 var(--f);letter-spacing:-.01em}
.sec__h small{color:var(--ink3);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 24px;border-radius:999px;font:400 15px/1 var(--f);letter-spacing:.04em;transition:transform .4s var(--spring),box-shadow .4s,filter .3s}
.btn--gold{color:#2a1b08;background:linear-gradient(180deg,#ffe7a8,#f1c76e 70%,#d9a449);box-shadow:0 8px 30px rgba(241,199,110,.28),inset 0 1px 0 rgba(255,255,255,.7)}
.btn--ghost{border:1px solid var(--line);background:rgba(255,236,190,.06)}
.btn--danger{border:1px solid rgba(255,140,120,.35);color:#ffb3a3}
.btn:active{transform:scale(.95)}
.btn .ico{width:18px;height:18px}
.fab{position:fixed;right:18px;bottom:calc(var(--navh) + var(--sab) + 28px);z-index:28;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#2a1b08;background:linear-gradient(180deg,#ffe7a8,#f1c76e 70%,#d9a449);box-shadow:0 10px 34px rgba(241,199,110,.4),0 0 0 6px rgba(241,199,110,.12);transform:scale(0);transition:transform .7s var(--spring);}
.fab.show{transform:scale(1)}
.fab:active{transform:scale(.9)!important}
.fab .ico{width:26px;height:26px;stroke-width:1.8}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 8px;margin:0 -18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:rgba(255,236,190,.05);font:300 14px/1 var(--f);color:var(--ink2);transition:all .4s var(--spring)}
.chip.on{background:rgba(255,214,140,.2);border-color:rgba(255,214,140,.55);color:#ffe9b8}
.chip:active{transform:scale(.93)}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font:400 11px/1 var(--f);letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin:0 2px 8px}
.in{width:100%;padding:14px 16px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid var(--line);font:300 16px/1.3 var(--f);transition:border-color .3s,box-shadow .3s}
.in:focus{border-color:rgba(255,214,140,.6);box-shadow:0 0 0 4px rgba(255,214,140,.1)}
textarea.in{resize:none;min-height:96px;line-height:1.45}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
.stars5{display:flex;gap:6px}
.stars5 button{width:38px;height:38px;color:rgba(255,236,190,.25);transition:color .3s,transform .5s var(--spring)}
.stars5 button.on{color:#ffd98a;filter:drop-shadow(0 0 8px rgba(255,200,110,.6))}
.stars5 button:active{transform:scale(.8)}
.stars5 .ico{width:100%;height:100%;fill:currentColor;stroke:none}
.empty{text-align:center;padding:40px 24px;color:var(--ink2)}
.empty b{display:block;font:200 24px/1.2 var(--f);margin-bottom:8px;color:var(--ink)}

/* ---------------- sheets & toast */
#sheets{position:fixed;inset:0;z-index:80;pointer-events:none}
.sheet-bg{position:absolute;inset:0;background:rgba(2,8,7,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .5s;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;border-radius:30px 30px 0 0;background:linear-gradient(180deg,rgba(18,42,36,.97),rgba(8,22,19,.99));border:1px solid var(--line);border-bottom:0;box-shadow:0 -20px 80px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .7s var(--ease);pointer-events:auto;padding-bottom:var(--sab);max-width:600px;margin:0 auto;will-change:transform}
.sheet.tall{height:92vh;height:92dvh}
.sheet-bg.in{opacity:1}.sheet.in{transform:none}
.sheet__grab{flex:none;padding:10px 0 4px;touch-action:none;cursor:grab}
.sheet__grab::after{content:"";display:block;width:44px;height:4px;border-radius:2px;margin:0 auto;background:rgba(255,236,190,.28)}
.sheet__head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 20px 12px;touch-action:none}
.sheet__head h3{font:200 24px/1.2 var(--f);letter-spacing:-.01em}
.sheet__x{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,236,190,.08);transition:transform .5s var(--spring)}
.sheet__x:active{transform:rotate(90deg) scale(.9)}
.sheet__x .ico{width:18px;height:18px}
.sheet__body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 28px;flex:1;scrollbar-width:none}
.sheet__body::-webkit-scrollbar{display:none}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 74px);z-index:90;max-width:min(88vw,420px);padding:12px 18px;border-radius:18px;background:rgba(10,30,26,.92);border:1px solid rgba(255,226,160,.3);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:300 15px/1.35 var(--f);text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 30px rgba(255,200,110,.12);transform:translate(-50%,-30px) scale(.9);opacity:0;pointer-events:none;transition:all .6s var(--spring)}
#toast.on{transform:translate(-50%,0) scale(1);opacity:1}

/* ---------------- campfire */
#fire{position:fixed;left:2px;bottom:calc(var(--navh) + var(--sab) + 18px);z-index:26;width:110px;height:110px;padding:0;pointer-events:auto;opacity:0;transform:scale(.6) translateY(30px);transition:opacity 1.2s .6s,transform 1.2s .6s var(--ease)}
body.ui #fire{opacity:1;transform:none}
#fire canvas{width:110px;height:110px;display:block}
.fire__tip{position:absolute;left:62px;top:6px;white-space:nowrap;font:italic 400 14px/1 var(--serif);color:#ffe3a6;opacity:0;transform:translateX(-6px);transition:all .6s;pointer-events:none;text-shadow:0 2px 10px #000}
.fire__tip.on{opacity:.95;transform:none}
body[data-tab=sky] #fire,body[data-tab=potion] #fire{opacity:.85}

/* ---------------- settings bits */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:16px}
.set:last-child{border:0}
.tog{width:52px;height:30px;border-radius:15px;background:rgba(255,236,190,.14);position:relative;transition:background .4s}
.tog i{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#f3ead3;transition:transform .5s var(--spring)}
.tog.on{background:linear-gradient(180deg,#ffd98a,#e0a94b)}.tog.on i{transform:translateX(22px);background:#fff}
.stepper{display:flex;align-items:center;gap:12px}.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);font-size:18px}.stepper b{min-width:34px;text-align:center;font-weight:400;font-size:18px}
.bigstep{display:flex;align-items:center;justify-content:center;gap:28px;margin:6px 0 10px}.bigstep button{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);font-size:28px;background:rgba(255,236,190,.06);transition:transform .4s var(--spring)}.bigstep button:active{transform:scale(.85)}
.bigstep>div{text-align:center;min-width:110px}.bigstep b{display:block;font:200 64px/1 var(--f);color:#ffe3a6}.bigstep small{color:var(--ink3);font-size:13px;letter-spacing:.1em}
/* ---------------- path: hello, goal, map */
.hello{padding-top:6px}.hello .eyebrow{margin-bottom:10px}.hello .sub{margin-top:8px}
.goal{padding:18px}
.goal__top{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring__bg{fill:none;stroke:rgba(255,236,190,.12);stroke-width:7}
.ring__fg{fill:none;stroke:url(#gRing);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1.6s var(--ease);filter:drop-shadow(0 0 8px rgba(255,200,110,.6))}
.ring__c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring__c b{font:200 34px/1 var(--f)}.ring__c small{font-size:11px;color:var(--ink3);margin-top:3px}
.goal__txt{flex:1;min-width:0}
.goal__msg{font:italic 400 18px/1.3 var(--serif);margin:8px 0 12px;color:var(--ink)}
.goal__btn{height:42px;padding:0 16px;font-size:14px}
.week{display:flex;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink3)}
.wd__bar{position:relative;width:100%;height:54px;border-radius:9px;background:rgba(255,236,190,.07);overflow:hidden;display:flex;align-items:flex-end}
.wd__bar i{display:block;width:100%;border-radius:9px;background:linear-gradient(180deg,#9fd1b5,#3a8b73);transition:height 1s var(--ease)}
.wd.ok .wd__bar i{background:linear-gradient(180deg,#ffe7a8,#e0a94b)}.wd.today span{color:#ffe3a6}
.wd__bar em{position:absolute;top:3px;left:50%;transform:translateX(-50%);font-size:12px;font-style:normal}
.goal__foot{margin-top:14px;font-size:13px;color:var(--ink2)}
.wbar{height:6px;border-radius:3px;background:rgba(255,236,190,.1);margin-top:8px;overflow:hidden}.wbar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#9fd1b5,#ffe7a8);transition:width 1.2s var(--ease)}
.map{padding:0;overflow:hidden;border-radius:26px}
#mapSvg{display:block;width:100%;height:auto}
#mapSvg .node{cursor:pointer}
#mapSvg .lbl{font:400 14px var(--f);fill:#ffe9b8;paint-order:stroke;stroke:#06140f;stroke-width:4px;letter-spacing:.02em}
#mapSvg .cnt{font:italic 400 12px var(--serif);fill:#cfe3dc;paint-order:stroke;stroke:#06140f;stroke-width:3px}
#mapSvg .locked .lbl{fill:#9bb5ac}
#mapSvg .art{transition:transform .6s var(--spring)}#mapSvg .open:active .art{transform:scale(.94)}
#mapSvg .flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-26}}
#mapSvg .tw{animation:tw 3s ease-in-out infinite}#mapSvg .tw.d2{animation-delay:-1s}#mapSvg .tw.d3{animation-delay:-2s}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
#mapSvg .wv{animation:wv 3.4s ease-in-out infinite}@keyframes wv{50%{transform:translateX(3px);opacity:.8}}
#mapSvg .smoke{animation:smoke 4s ease-out infinite}@keyframes smoke{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-22px) translateX(8px);opacity:0}}
#mapSvg .fogx{animation:fogx 9s ease-in-out infinite alternate}@keyframes fogx{to{transform:translateX(14px)}}
#mapSvg .mk{animation:mk 2.4s ease-in-out infinite}@keyframes mk{50%{transform:translateY(-5px)}}
#mapSvg .shake{animation:shake .5s}@keyframes shake{20%{transform:translate(var(--sx,0),0) rotate(-2deg)}}
.loc-art{margin:-6px -20px 6px;background:radial-gradient(70% 60% at 50% 55%,rgba(255,200,110,.18),transparent 70%);max-height:300px;display:flex;justify-content:center}
.loc-art svg{max-height:290px;width:auto}
.shelf-row{display:flex;gap:12px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.mini{width:84px;flex:none}
.stk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stk__i{aspect-ratio:1;border-radius:18px;background:rgba(255,236,190,.05);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.stk__i span{font-size:30px;filter:grayscale(.9);opacity:.5}.stk__i.ok span{filter:none;opacity:1}.stk__i small{font-size:11px;color:var(--ink3)}.stk__i.ok{background:rgba(255,214,140,.1);border-color:rgba(255,214,140,.35)}

/* ---------------- books */
.search{display:flex;align-items:center;gap:10px;padding:0 16px;height:50px;margin:16px 0 12px;border-radius:18px}
.search .ico{width:20px;height:20px;color:var(--ink3)}.srch{flex:1;height:100%;font:300 16px var(--f)}.srch::placeholder{color:var(--ink3)}
.wrapchips{flex-wrap:wrap;overflow:visible;margin:0;padding:0 0 6px}
.note{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 12px 18px;margin-bottom:14px;font-size:14px;color:var(--ink2);border-radius:18px}
.note .btn{height:36px;padding:0 16px;font-size:13px}
.shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 18px;padding-top:6px}
.bk{display:block;text-align:left;position:relative;perspective:800px}
.bk__c{position:relative;transition:transform .6s var(--spring);transform-origin:50% 100%}
.bk:active .bk__c{transform:scale(.95) translateY(2px)}
.bk::after{content:"";position:absolute;left:-8px;right:-8px;top:calc((100vw - 36px - 18px)/2*1.5 - 2px);height:9px;border-radius:3px;background:linear-gradient(180deg,#5a3a22,#2f1d10);box-shadow:0 8px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,214,140,.25);z-index:-1}
@media (min-width:600px){.bk::after{top:calc(250px*1.5 - 2px)}}
.bk.fall{animation:pull .9s var(--ease) backwards;animation-delay:calc(var(--i)*70ms)}
@keyframes pull{from{opacity:0;transform:translateY(40px) rotateY(-50deg) scale(.9)}to{opacity:1;transform:none}}
.bk__t{display:block;margin-top:14px;font:400 15px/1.25 var(--f);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk__a{display:block;font:italic 400 14px/1.2 var(--serif);color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk__bar{position:absolute;left:8px;right:8px;bottom:8px;height:5px;border-radius:3px;background:rgba(0,0,0,.55);overflow:hidden}.bk__bar i{display:block;height:100%;background:linear-gradient(90deg,#9fd1b5,#ffe7a8);border-radius:3px}
.bk__tag{position:absolute;top:8px;right:8px;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font:400 11px/1 var(--f);color:#ffe3a6}
.bk__tag--ok{color:#ffd98a;letter-spacing:.1em}
.bk__ribbon{position:absolute;top:-4px;right:12px;width:18px;height:34px;background:linear-gradient(180deg,#e0556b,#a8324a);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.cover{position:relative;aspect-ratio:2/3;width:100%;border-radius:4px 10px 10px 4px;background:linear-gradient(160deg,hsl(var(--h) 42% 30%),hsl(calc(var(--h) + 28) 48% 14%));box-shadow:0 14px 26px rgba(0,0,0,.5),inset 6px 0 8px -4px rgba(255,255,255,.18),inset -2px 0 4px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16% 12%;text-align:center;overflow:hidden}
.cover::before{content:"";position:absolute;inset:7px 7px 7px 11px;border:1px solid rgba(255,214,140,.55);border-radius:2px 6px 6px 2px;outline:1px solid rgba(255,214,140,.18);outline-offset:3px}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.12) 60%,transparent)}
.cover__orn{width:34%;fill:none;stroke:#f1c76e;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.cover__t{font:600 clamp(14px,4.4vw,19px)/1.15 var(--serif);color:#ffeec4;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.cover__a{font:italic 400 12px/1.2 var(--serif);color:rgba(255,238,196,.75);letter-spacing:.04em}
.cover--img{padding:0;background:#000}.cover--img::before{display:none}.cover--img img{width:100%;height:100%;object-fit:cover}
.seg{display:flex;padding:4px;border-radius:16px;background:rgba(0,0,0,.3);border:1px solid var(--line);margin:14px 0}
.seg button{flex:1;height:40px;border-radius:12px;font:300 14px var(--f);color:var(--ink2);transition:all .45s var(--spring)}
.seg button.on{background:linear-gradient(180deg,rgba(255,226,160,.28),rgba(255,214,140,.14));color:#fff0c8;box-shadow:inset 0 0 0 1px rgba(255,226,160,.35)}
.bd{text-align:center}
.bd__cover{position:relative;width:min(52vw,210px);margin:6px auto 18px;transition:transform .3s;transform-style:preserve-3d}
.bd__glow{position:absolute;inset:-20%;z-index:-1;background:radial-gradient(closest-side,rgba(255,200,110,.3),transparent);filter:blur(10px)}
.bd__t{font:200 28px/1.15 var(--f);letter-spacing:-.01em;text-wrap:balance}.bd__a{margin-top:6px}
.bd .sec__h,.bd .stars5,.bd .chips,.bd textarea,.bd #bdQ{text-align:left}
.bd__pr{padding:16px 18px;margin:6px 0 18px;text-align:left}.bd__prh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:15px;color:var(--ink2)}.bd__prh b{font:200 28px/1 var(--f);color:#ffe3a6}
.wbar.big{height:9px;border-radius:5px}.wbar.big i{border-radius:5px}
.qmini{padding:14px 16px;margin-bottom:8px;border-radius:14px;background:rgba(255,236,190,.06);border-left:3px solid var(--gold);font:italic 400 17px/1.35 var(--serif);text-align:left}
.eb{display:flex;gap:16px;align-items:flex-start;margin-bottom:6px}.eb__prev{width:104px;flex:none}.eb__f{flex:1;min-width:0}
.hues{display:flex;gap:8px;flex-wrap:wrap}.hues button,.hues__ph{width:36px;height:36px;border-radius:12px;border:1px solid var(--line)}.hues__ph{display:grid;place-items:center;color:var(--ink2);cursor:pointer}.hues__ph .ico{width:20px;height:20px}
/* ---------------- quotes */
.pc{position:relative;display:block;margin:0 auto 26px;max-width:480px;transform:rotate(var(--rot,0deg));filter:drop-shadow(0 14px 18px rgba(0,0,0,.5));cursor:pointer;transition:transform .6s var(--spring)}
.pc:active{transform:rotate(0) scale(.97)}
.pc.drop{animation:drop .9s var(--spring) backwards;animation-delay:calc(var(--i)*90ms)}
@keyframes drop{from{opacity:0;transform:translateY(-70px) rotate(calc(var(--rot) * 6)) scale(.9)}to{opacity:1}}
.pc__in{position:relative;padding:34px 26px 28px;min-height:150px;color:var(--ink-dark);overflow:hidden}
.paper--parch{background:var(--noise),radial-gradient(130% 90% at 18% 8%,#f7ebcb,#e6d1a2 62%,#cdb078);box-shadow:inset 0 0 50px rgba(120,70,20,.35)}
.paper--kraft{background:var(--noise),radial-gradient(130% 90% at 18% 8%,#dfb98b,#bd8f5f 64%,#9a6c40);box-shadow:inset 0 0 50px rgba(60,30,5,.4);color:#2a1a0e}
.paper--night{background:var(--noise),radial-gradient(130% 90% at 18% 8%,#26376a,#0e1736 70%);color:#ffe6a3;box-shadow:inset 0 0 50px rgba(0,0,10,.6)}
.pc__t{font:400 26px/1.28 var(--hand);text-align:center;text-wrap:balance;padding-right:0}
.pc__src{margin-top:16px;text-align:center;font:italic 400 15px/1.3 var(--serif);opacity:.78}
.pc__tags{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;margin-top:12px;font:300 12px var(--f);opacity:.7}.pc__tags i{font-style:normal}
.pc__stk{position:absolute;right:12px;top:8px;font-size:34px;transform:rotate(var(--r,0deg));filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.pc__ph{position:relative;width:104px;margin:16px 0 0 auto;transform:rotate(5deg);padding:6px 6px 22px;background:#fffaf0;box-shadow:0 6px 14px rgba(0,0,0,.35)}.pc__ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.pc__ph b{position:absolute;left:50%;top:-10px;width:44px;height:16px;margin-left:-22px;background:rgba(240,220,160,.8);transform:rotate(-3deg)}
.pc.big .pc__t{font-size:30px}.pc.big{max-width:none;transform:rotate(0)}
.pc.prev{margin-bottom:18px;transform:rotate(0)}
.pcv{padding:6px 0 0}.qprev{margin-bottom:16px}
.stkpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stkpick button{aspect-ratio:1;border-radius:14px;background:rgba(255,236,190,.06);border:1px solid var(--line);font-size:24px;transition:all .4s var(--spring)}.stkpick button.on{background:rgba(255,214,140,.22);border-color:rgba(255,214,140,.6);transform:scale(1.08)}.stkpick .lock{opacity:.5;font-size:18px}
/* ---------------- sky */
#v-sky{padding:0;overflow:hidden;background:#040818}
#skyCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.sky__ui{position:absolute;inset:0;pointer-events:none;padding-top:calc(var(--sat) + 78px)}
.sky__hint{position:absolute;left:0;right:0;bottom:calc(var(--navh) + var(--sab) + 120px);text-align:center;padding:0 40px;font:italic 400 16px/1.35 var(--serif);color:var(--ink2);pointer-events:none}
.sky__panel{position:absolute;left:0;right:0;bottom:calc(var(--navh) + var(--sab) + 26px);display:flex;gap:10px;overflow-x:auto;padding:4px 18px;pointer-events:auto;scrollbar-width:none}.sky__panel::-webkit-scrollbar{display:none}
.cstl{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 16px 12px 36px;position:relative;border-radius:18px;background:rgba(10,16,48,.7);border:1px solid hsla(var(--h),70%,70%,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:left;transition:transform .4s var(--spring)}
.cstl:active{transform:scale(.94)}.cstl i{position:absolute;left:14px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:hsl(var(--h) 90% 80%);box-shadow:0 0 12px 3px hsla(var(--h),90%,70%,.7)}.cstl b{font:italic 500 15px/1.1 var(--serif);color:hsl(var(--h) 80% 88%)}.cstl small{font-size:12px;color:var(--ink3)}
.starc{display:flex;gap:18px;align-items:flex-start}.starc__c{width:92px;flex:none}.stars5.sm button{width:22px;height:22px}.stars5.sm{gap:2px;margin-top:8px}

/* ============ premium layer: OLED black, thin serif, gold-hairline glass (overrides the base UI) */
:root{--gold:#e9c984;--glow:#ffd98a;--ink:#f1e8d2;--ink2:rgba(241,232,210,.66);--ink3:rgba(241,232,210,.38);--line:rgba(255,226,160,.14)}
.glass,.pill,.card{position:relative}
.glass,.pill,.tabs,.sheet,.chip,.in,.btn--ghost{background:rgba(9,12,12,.5);backdrop-filter:blur(22px) saturate(1.45);-webkit-backdrop-filter:blur(22px) saturate(1.45);border-color:transparent}
.glass::before,.pill::before,.tabs::before,.sheet::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,rgba(255,226,160,.7),rgba(255,226,160,.1) 34%,rgba(255,226,160,.04) 62%,rgba(255,226,160,.4));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.glass{border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,236,190,.07)}
.chip,.in,.btn--ghost{border:1px solid rgba(255,226,160,.18)}
.chip.on{background:rgba(255,214,140,.14);border-color:rgba(255,214,140,.6);color:#ffeec4;box-shadow:0 0 18px rgba(255,200,110,.2)}
.in:focus{border-color:rgba(255,214,140,.65);box-shadow:0 0 0 4px rgba(255,214,140,.08),0 0 24px rgba(255,200,110,.15)}
/* header */
.top{background:linear-gradient(180deg,rgba(0,0,0,.88),rgba(0,0,0,0))}
.medal{width:44px;height:44px;padding:2px;background:linear-gradient(160deg,rgba(255,232,170,.95),rgba(255,226,160,.12) 45%,rgba(255,226,160,.6));box-shadow:0 0 20px rgba(255,200,110,.28)}
.medal__img{background-color:#050808;border:2px solid #000}
.top__ttl small{font:italic 300 13px/1 var(--serif);letter-spacing:.3em;text-transform:lowercase;color:rgba(246,230,189,.62)}
.top__ttl b{font:400 italic 31px/1.05 var(--serif);letter-spacing:.03em;color:#ffd98a;text-shadow:0 0 1px rgba(255,235,190,.8),0 0 18px rgba(255,190,90,.55);margin-top:2px}
.pill{border-radius:999px;color:#f6e6bd}
/* tab bar */
.tabs{border-radius:30px;background:rgba(6,9,9,.58);box-shadow:0 20px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,236,190,.08)}
.tabs button{font:400 10px/1 var(--f);letter-spacing:.16em;text-transform:uppercase}
.tabs button.on{color:#ffe7b0}
.tabs button.on .ico{filter:drop-shadow(0 0 10px rgba(255,200,110,.85))}
.tabs__glow{background:radial-gradient(80% 90% at 50% 10%,rgba(255,214,140,.2),rgba(255,214,140,0) 75%);box-shadow:none}
/* typography */
.h1{font:300 clamp(32px,9.4vw,44px)/1.05 var(--serif);letter-spacing:.01em;color:#f6e6bd;text-shadow:0 0 22px rgba(255,200,110,.28)}
.h1 em{font:italic 400 1em/1 var(--serif);color:#ffd98a;text-shadow:0 0 24px rgba(255,190,90,.55)}
.sub{font:italic 300 18px/1.4 var(--serif);color:var(--ink2)}
.sec__h h3{font:300 24px/1.2 var(--serif);letter-spacing:.02em;color:#f6e6bd}
.eyebrow{font:400 10px/1 var(--f);letter-spacing:.34em;color:var(--gold)}
.empty b{font:300 28px/1.2 var(--serif);color:#f6e6bd}
.sheet__head h3{font:300 28px/1.2 var(--serif);letter-spacing:.01em;color:#f6e6bd}
/* buttons */
.btn{letter-spacing:.2em;text-transform:uppercase;font-size:12px;font-weight:400}
.btn--gold{color:#1a1206;background:linear-gradient(180deg,#f9e3ae,#e9c984 60%,#c99b4a);box-shadow:0 10px 36px rgba(233,201,132,.26),0 0 0 1px rgba(255,236,190,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.fab{color:#1a1206;background:linear-gradient(180deg,#f9e3ae,#e9c984 60%,#c99b4a);box-shadow:0 10px 36px rgba(233,201,132,.35),0 0 0 6px rgba(233,201,132,.1)}
/* sheets */
.sheet{background:linear-gradient(180deg,rgba(14,18,18,.9),rgba(2,4,4,.97));backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);border:0;box-shadow:0 -24px 90px rgba(0,0,0,.8)}
.sheet-bg{background:rgba(0,0,0,.66)}
.iris,#iris{border-color:rgba(255,226,160,.7)}
#toast{background:rgba(8,10,10,.7);border:1px solid rgba(255,226,160,.25);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.pc__t{font:italic 500 27px/1.28 var(--serif);letter-spacing:.005em}
#qeT{font-family:var(--serif)!important;font-style:italic;font-size:22px!important}
/* ---- trail */
.trail{position:relative;padding-left:44px;display:grid;gap:18px}
.trail__line{position:absolute;left:15px;width:2px;background:linear-gradient(180deg,rgba(255,226,160,.08),rgba(255,226,160,.18));border-radius:1px}
.trail__fill{position:absolute;left:0;top:0;width:2px;background:linear-gradient(180deg,rgba(255,226,160,.2),#ffd98a);box-shadow:0 0 12px 1px rgba(255,200,110,.8);transition:height 1.2s var(--ease)}
.trail__me{position:absolute;left:-1px;top:0;width:34px;height:34px;margin-top:-17px;z-index:3;border-radius:50%;padding:2px;background:linear-gradient(160deg,#ffe8b0,#b98a3c);box-shadow:0 0 0 5px rgba(255,200,110,.14),0 0 26px rgba(255,200,110,.6);animation:pulseMe 3s ease-in-out infinite;pointer-events:none}
.trail__me .medal__img{border-width:1.5px}
@keyframes pulseMe{50%{box-shadow:0 0 0 10px rgba(255,200,110,.04),0 0 38px rgba(255,200,110,.75)}}
.loc{position:relative}
.loc__dot{position:absolute;left:-36px;top:34px;width:9px;height:9px;margin:-4.5px 0 0 -.5px;border-radius:50%;background:#2a2a24;border:1px solid rgba(255,226,160,.35);z-index:1}
.loc.open .loc__dot{background:#ffd98a;border-color:#fff1c8;box-shadow:0 0 12px 2px rgba(255,200,110,.8)}
.loc__card{position:relative;height:168px;border-radius:22px;overflow:hidden;isolation:isolate;box-shadow:0 20px 50px rgba(0,0,0,.6);cursor:pointer;transition:transform .6s var(--spring)}
.loc__card:active{transform:scale(.97)}
.loc__card::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,rgba(255,226,160,.7),rgba(255,226,160,.08) 38%,rgba(255,226,160,.04) 62%,rgba(255,226,160,.4));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:3}
.loc__ph{position:absolute;inset:-2px;background-size:cover;background-position:center;transform:scale(1.04);transition:transform 1.4s var(--ease),filter .8s}
.loc.open .loc__card:hover .loc__ph{transform:scale(1.1)}
.loc.locked .loc__ph{filter:blur(9px) grayscale(.6) brightness(.55);transform:scale(1.25)}
.loc__shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.2) 40%,rgba(0,0,0,.86));z-index:1}
.loc__txt{position:absolute;left:18px;right:18px;bottom:14px;z-index:2}
.loc__txt small{display:block;font:400 9px/1 var(--f);letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.loc__txt h4{margin:0;font:400 26px/1.05 var(--serif);color:#f6e6bd;text-shadow:0 0 18px rgba(255,200,110,.3)}
.loc.locked h4{color:rgba(246,230,189,.6);font-style:italic}
.loc__txt p{margin:6px 0 0;font:italic 300 14px/1.3 var(--serif);color:rgba(246,230,189,.7);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.loc__meta{position:absolute;right:14px;top:14px;z-index:2;padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:400 10px/1 var(--f);letter-spacing:.16em;text-transform:uppercase;color:rgba(246,230,189,.85)}
.loc__lock{position:absolute;left:50%;top:38%;width:30px;height:30px;margin:-15px 0 0 -15px;z-index:2;color:#ffe0a0;filter:drop-shadow(0 0 10px rgba(255,200,110,.7))}
.loc.cur .loc__card{box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(255,200,110,.18)}
.loc.shake .loc__card{animation:shk .5s}
@keyframes shk{20%{transform:translateX(-6px)}50%{transform:translateX(5px)}80%{transform:translateX(-2px)}}
.loc-hero{position:relative;height:210px;margin:0 -2px;border-radius:20px;overflow:hidden}
.loc-hero__ph{position:absolute;inset:0;background-size:cover;background-position:center;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.12)}}
.loc-hero__shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(2,4,4,.95))}
/* ---- potion room */
.flasks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.flask{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:20px;background:rgba(9,12,12,.5);border:1px solid rgba(255,226,160,.12);transition:transform .5s var(--spring),border-color .4s,box-shadow .4s,background .4s}
.flask .fl{width:44px;height:60px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6));transition:transform .6s var(--spring)}
.flask span{font:400 10px/1 var(--f);letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.flask.on{border-color:var(--c);background:rgba(255,255,255,.03);box-shadow:0 0 28px color-mix(in srgb,var(--c) 40%,transparent),inset 0 0 20px color-mix(in srgb,var(--c) 14%,transparent)}
.flask.on .fl{transform:translateY(-4px) rotate(-8deg) scale(1.08)}
.flask.on span{color:#f6e6bd}
.flask:active{transform:scale(.94)}
.cauldron{position:relative;height:230px;margin-top:18px;border-radius:26px;background:radial-gradient(70% 70% at 50% 60%,rgba(255,170,80,.08),transparent 70%),rgba(4,6,6,.5);border:1px solid rgba(255,226,160,.12);overflow:hidden;transition:border-color .4s,box-shadow .4s}
.cauldron canvas{position:absolute;inset:0;width:100%;height:100%}
.cauldron.hot{border-color:rgba(255,226,160,.7);box-shadow:0 0 40px rgba(255,200,110,.25)}
.cauldron.boil{animation:boil .5s infinite}
@keyframes boil{50%{transform:translateY(-2px)}}
.cauldron__hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font:italic 300 15px/1 var(--serif);color:rgba(246,230,189,.7);pointer-events:none}
.ingr{display:flex;gap:10px;margin-top:14px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.ingr::-webkit-scrollbar{display:none}
.ing{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;width:84px;padding:12px 4px;border-radius:18px;background:rgba(9,12,12,.5);border:1px solid rgba(255,226,160,.12);color:var(--c);touch-action:none;transition:transform .4s var(--spring),border-color .3s,box-shadow .3s}
.ing .ico{width:28px;height:28px;stroke-width:1.3;filter:drop-shadow(0 0 8px var(--c))}
.ing span{font:400 9px/1.2 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);text-align:center}
.ing.on{border-color:var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 35%,transparent)}
.ing.lift{opacity:.35}
.ing.ghost{position:fixed;z-index:200;pointer-events:none;transform:translate(-50%,-60%) scale(1.15);box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 30px var(--c);background:rgba(10,14,14,.9)}
.reco{padding:20px}
.reco__row{display:flex;gap:16px;margin-top:14px;align-items:flex-start}
.reco__row h3{margin:0 0 4px;font:400 26px/1.1 var(--serif);color:#f6e6bd}
.reco__cover{width:96px;flex:none}
.reco__why{margin:8px 0;font:300 12px/1.4 var(--f);color:var(--ink3);letter-spacing:.04em}
.tag{display:inline-block;margin:0 6px 6px 0;padding:5px 10px;border-radius:999px;border:1px solid rgba(255,226,160,.25);font:400 10px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.wrow{display:grid;grid-template-columns:78px 1fr;gap:12px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(255,226,160,.08);font:300 15px/1.35 var(--f);color:var(--ink2)}.wrow:last-child{border:0}
.fire__tip{left:70px;top:14px;padding:8px 12px;border-radius:999px;background:rgba(6,9,9,.6);border:1px solid rgba(255,226,160,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:italic 300 14px/1 var(--serif);color:#f6e6bd}
body[data-tab=potion] #fire{opacity:0;pointer-events:none}
#fire{width:96px;height:96px;left:6px}#fire canvas{width:96px;height:96px}

/* ============ the room: first-person desk, objects instead of menus */
html,body{background:#000}
#stage{position:fixed;inset:0;z-index:1;overflow:hidden;touch-action:none;cursor:grab;background:#000}
#stage.grab{cursor:grabbing}
#room{position:absolute;left:0;top:0;width:2368px;height:1320px;transform-origin:0 0;will-change:transform;opacity:.0;transition:opacity 1.8s ease}
#stage.in #room,#gate:not(.out) ~ #stage #room{opacity:1}
#room{opacity:.45}#stage.in #room{opacity:1}
#roomImg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
#dim{position:absolute;inset:0;background:#0a1226;opacity:.62;mix-blend-mode:multiply;pointer-events:none}
#glow{position:absolute;opacity:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(closest-side,rgba(255,160,70,.17),rgba(255,120,40,.09) 40%,rgba(255,100,30,.06) 72%,rgba(255,100,30,0));will-change:opacity}
#fireCv{position:absolute;pointer-events:none}
#pageTxt{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;color:#3a220f;font-family:"Caveat","Cormorant Garamond",cursive;text-align:center;mix-blend-mode:multiply;padding:30px 24px;opacity:.88}
#pageTxt h2{margin:0;font:600 84px/1 "Caveat",cursive}
#pageTxt .fl{display:block;width:300px;height:4px;margin:18px auto 42px;border-radius:3px;background:linear-gradient(90deg,transparent,#5b3a1c 30%,#5b3a1c 70%,transparent);opacity:.7}
#pageTxt p{margin:0 0 6px;font:500 50px/1.1 "Caveat",cursive;opacity:.75}
#pageTxt b{display:block;font:600 70px/1.08 "Caveat",cursive;text-wrap:balance}
#pageTxt small{display:block;margin-top:46px;font:500 44px/1 "Caveat",cursive;opacity:.7}
#hsFx{position:absolute;inset:0;pointer-events:none}
.hs{position:absolute;opacity:0;transition:opacity .28s;mix-blend-mode:screen;background:radial-gradient(closest-side,rgba(255,216,140,.75),rgba(255,200,110,.28) 62%,rgba(255,200,110,0))}
.hs.on{opacity:1}
.glint{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;opacity:0;pointer-events:none;animation:glint 7s ease-in-out infinite;mix-blend-mode:screen}
.glint::before,.glint::after{content:"";position:absolute;left:50%;top:50%;background:linear-gradient(90deg,transparent,#fff3d0,transparent);border-radius:2px}
.glint::before{width:88px;height:3px;margin:-1.5px 0 0 -44px}
.glint::after{width:3px;height:88px;margin:-44px 0 0 -1.5px;background:linear-gradient(180deg,transparent,#fff3d0,transparent)}
@keyframes glint{0%,70%,100%{opacity:0;transform:scale(.2) rotate(0)}82%{opacity:.95;transform:scale(1) rotate(40deg)}92%{opacity:0;transform:scale(.4) rotate(70deg)}}
.knoblight{position:absolute;width:250px;height:250px;margin:-125px 0 0 -125px;border-radius:50%;pointer-events:none;mix-blend-mode:screen;box-shadow:0 0 60px 10px rgba(255,170,80,.5),inset 0 0 36px 4px rgba(255,190,110,.35);opacity:0}
#labels .lab{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 1s,transform 1.2s cubic-bezier(.2,.9,.2,1);font:italic 400 50px/1 "Cormorant Garamond",serif;letter-spacing:.04em;color:#fbe9bf;text-shadow:0 0 18px rgba(255,190,90,.8),0 3px 14px rgba(0,0,0,.9)}
#labels.show .lab{opacity:.92}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;display:block}
#tint{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(90% 70% at 50% 45%,rgba(2,1,0,.28),rgba(0,0,0,.6));opacity:0;transition:opacity .9s var(--ease)}
body.panel #tint{opacity:1}
#vignette{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(125% 95% at 50% 50%,transparent 52%,rgba(0,0,0,.62))}
#hint{position:fixed;left:0;right:0;top:calc(var(--sat) + 78px);z-index:6;text-align:center;padding:0 40px;pointer-events:none;font:italic 300 19px/1.35 var(--serif);letter-spacing:.03em;color:#f6e6bd;text-shadow:0 0 18px rgba(255,190,90,.55),0 2px 14px #000;opacity:0;transform:translateY(10px);transition:opacity 1.2s,transform 1.4s var(--ease)}
#hint.on{opacity:.95;transform:none}
/* gate over the dark room */
#gate{z-index:20;background:radial-gradient(90% 70% at 50% 50%,rgba(0,0,0,.35),rgba(0,0,0,.84))}
/* panels */
#app{position:fixed;inset:0;z-index:30;pointer-events:none}
.view{padding:calc(var(--sat) + 74px) 0 calc(var(--sab) + 56px);background:linear-gradient(180deg,rgba(8,5,3,.5),rgba(4,3,2,.74));backdrop-filter:blur(30px) saturate(1.3) brightness(1);-webkit-backdrop-filter:blur(30px) saturate(1.3) brightness(1)}
#v-sky{background:radial-gradient(120% 80% at 50% 0,#0b1030,#01020a 70%)}
#v-potion{background:rgba(1,6,5,.88)}
#back{position:fixed;left:14px;top:calc(var(--sat) + 14px);z-index:40;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#f6e6bd;background:rgba(8,10,10,.55);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 20px rgba(255,200,110,.12);opacity:0;transform:translateX(-14px) scale(.7);pointer-events:none;transition:opacity .5s .3s,transform .8s .3s var(--spring)}
#back::before{content:"";position:absolute;inset:0;border-radius:50%;padding:1px;background:linear-gradient(160deg,rgba(255,226,160,.85),rgba(255,226,160,.1) 40%,rgba(255,226,160,.45));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
#back .ico{width:24px;height:24px}
body.panel #back{opacity:1;transform:none;pointer-events:auto}
#back:active{transform:scale(.88)!important}
.fab{bottom:calc(var(--sab) + 26px);z-index:35}
/* bag */
.bagrow{display:grid;gap:12px;margin-top:18px}
.bagit{position:relative;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-radius:20px;background:rgba(9,12,12,.5);border:1px solid rgba(255,226,160,.16);font:italic 400 22px/1 var(--serif);color:#f6e6bd;transition:transform .5s var(--spring),border-color .3s}
.bagit:active{transform:scale(.97);border-color:rgba(255,226,160,.5)}
.bagit b{font:400 20px/1 var(--f);color:var(--gold)}
.bagnote{margin-top:20px;text-align:center}
.bagnote b{font-style:normal;color:#ffd98a;font-weight:400}
/* reader */
.rd{position:fixed;inset:0;z-index:70;background:var(--bg,#000);color:var(--fg,#d9d3c4);touch-action:pan-y;-webkit-user-select:none;user-select:none}
.rd[hidden]{display:none}
.rd__bar{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(var(--sat) + 10px) 12px 10px;background:linear-gradient(180deg,var(--bg),transparent);transition:opacity .5s,transform .7s var(--ease)}
.rd:not(.chrome) .rd__bar{opacity:0;transform:translateY(-100%)}
.rd__b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ac);flex:none;transition:transform .4s var(--spring)}
.rd__b:active{transform:scale(.85)}
.rd__b--aa{font:italic 500 22px/1 var(--serif)}
.rd__b .ico{width:24px;height:24px}
.rd__t{flex:1;min-width:0;text-align:center;line-height:1.15}
.rd__t b{display:block;font:500 17px/1.15 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.rd__t small{font:300 11px/1 var(--f);letter-spacing:.2em;text-transform:uppercase;opacity:.5}
.rd__view{position:absolute;left:0;right:0;top:calc(var(--sat) + 70px);bottom:calc(var(--sab) + 54px);overflow:hidden}
.rd__flow{transform-origin:50% 50%;will-change:transform;column-fill:auto;hyphens:auto;-webkit-hyphens:auto;text-align:left;letter-spacing:.005em}
.rd__flow h2{margin:1.2em 0 .7em;font-weight:500;font-size:1.35em;line-height:1.2;color:var(--ac);text-wrap:balance;break-after:avoid}
.rd__flow h2:first-child{margin-top:.2em}
.rd__flow p{margin:0;text-indent:1.4em;white-space:pre-line;orphans:2;widows:2}
.rd__flow h2+p{text-indent:0}
.rd__edge{position:absolute;top:0;bottom:0;width:36px;pointer-events:none;opacity:calc(var(--sh,0)*1);z-index:2}
.rd__edge--l{left:0;background:linear-gradient(90deg,rgba(0,0,0,.45),transparent)}
.rd__edge--r{right:0;background:linear-gradient(270deg,rgba(0,0,0,.45),transparent)}
.rd[data-th=sepia] .rd__edge{display:none}
.rd__foot{position:absolute;left:0;right:0;bottom:0;padding:0 28px calc(var(--sab) + 18px);display:flex;flex-direction:column;gap:10px;align-items:center;font:300 11px/1 var(--f);letter-spacing:.22em;text-transform:uppercase;opacity:.65}
.rd__line{width:100%;height:1px;background:color-mix(in srgb,var(--fg) 18%,transparent);overflow:hidden}
.rd__line i{display:block;height:100%;background:var(--ac);transform-origin:0 0;transition:transform .6s var(--ease);box-shadow:0 0 8px var(--ac)}
.rd__fin{position:absolute;left:50%;bottom:calc(var(--sab) + 64px);transform:translateX(-50%);z-index:6;padding:14px 28px;border-radius:999px;font:400 12px/1 var(--f);letter-spacing:.22em;text-transform:uppercase;color:#1a1206;background:linear-gradient(180deg,#f9e3ae,#e9c984 60%,#c99b4a);box-shadow:0 10px 36px rgba(233,201,132,.3)}
.rd__fin[hidden]{display:none}
.rd__set{position:absolute;left:12px;right:12px;top:calc(var(--sat) + 66px);z-index:8;padding:8px 18px;border-radius:24px;background:rgba(10,12,12,.82);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,226,160,.18);color:#e8dcc0;opacity:0;transform:translateY(-14px) scale(.96);transform-origin:80% 0;pointer-events:none;transition:opacity .4s,transform .7s var(--spring)}
.rd.setting .rd__set{opacity:1;transform:none;pointer-events:auto}
.rd__row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid rgba(255,226,160,.08)}
.rd__row:last-child{border:0}
.rd__row>span{font:400 10px/1 var(--f);letter-spacing:.24em;text-transform:uppercase;color:var(--gold);flex:none;width:64px}
.rd__row input[type=range]{flex:1;accent-color:#e9c984}
.rd__seg{display:flex;flex:1;gap:6px;justify-content:flex-end}
.rd__seg button{flex:1;padding:9px 4px;border-radius:12px;border:1px solid rgba(255,226,160,.16);font:400 14px/1 var(--f);color:rgba(232,220,192,.75);transition:all .35s var(--spring)}
.rd__seg button.on{border-color:rgba(255,214,140,.7);color:#fff0c8;background:rgba(255,214,140,.12)}
.rd__seg--th button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px}
.rd__seg--th i{width:22px;height:22px;border-radius:50%;background:var(--c);border:1px solid rgba(255,226,160,.5)}
.rd[data-th=sepia] .rd__bar{background:linear-gradient(180deg,#f1e4c7,transparent)}

/* ---------------- rooms: only the current room's layers are shown */
#room > .r-main,#room > .r-lab,#room > .r-lib{display:none}
#room[data-room=main] > .r-main,#room[data-room=lab] > .r-lab,#room[data-room=lib] > .r-lib{display:block}
#room[data-room=main] > canvas.r-main{display:block}
#room:not([data-room=main]){-webkit-mask-image:none;mask-image:none}
#casketImg{position:absolute;pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 18px 20px rgba(0,0,0,.6))}
#dim{background:#080c1c}
#shade{position:absolute;inset:0;mix-blend-mode:multiply;pointer-events:none;opacity:0}
#curtain{position:fixed;inset:0;z-index:26;background:#000;opacity:0;pointer-events:none;transition:opacity .6s ease}
#curtain.on{opacity:1}
body.inroom #back{opacity:1;transform:none;pointer-events:auto}
/* library */
#libLayer,#labLayer{position:absolute;inset:0;overflow:hidden;color:#f6e6bd}
.lib__t{position:absolute;top:118px;left:0;right:0;text-align:center;pointer-events:none}
.lib__t small{display:block;font:400 25px/1 var(--f);letter-spacing:.42em;text-transform:uppercase;color:#e9c984;margin-bottom:14px}
.lib__t b{font:italic 400 84px/1 var(--serif);text-shadow:0 0 30px rgba(255,190,90,.6)}
.shelf3{position:absolute;left:104px;right:104px;height:340px;overflow:hidden;touch-action:none;border-radius:6px;background:linear-gradient(180deg,#0d0805,#1d120b 72%,#0e0805);box-shadow:inset 0 16px 44px rgba(0,0,0,.85),inset 0 0 0 2px rgba(255,226,160,.07),0 18px 40px rgba(0,0,0,.6)}
.shelf3::after{content:"";position:absolute;left:0;right:0;bottom:0;height:32px;background:linear-gradient(180deg,#6a4626,#3d2514 55%,#1f1209);box-shadow:0 -2px 0 rgba(255,222,170,.22);pointer-events:none}
.shelf3__in{position:absolute;left:0;bottom:32px;display:flex;align-items:flex-end;gap:7px;padding:0 20px;will-change:transform}
.sp{flex:none;position:relative;width:var(--w);height:var(--h);border-radius:5px 5px 1px 1px;display:flex;align-items:center;justify-content:center;overflow:visible;color:#ecd8a8;background:linear-gradient(90deg,hsl(var(--hu) 38% 11%),hsl(var(--hu) 42% 28%) 36%,hsl(var(--hu) 38% 19%) 64%,hsl(var(--hu) 34% 9%));box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),4px 0 10px rgba(0,0,0,.65);transition:transform .5s var(--spring),filter .35s}
.sp__band{position:absolute;left:0;right:0;top:20px;height:7px;border-block:1.5px solid rgba(233,201,132,.8);background:rgba(0,0,0,.2)}
.sp__band--b{top:auto;bottom:20px}
.sp b{writing-mode:vertical-rl;font:600 var(--fs,24px)/1.1 var(--serif);white-space:normal;max-height:calc(var(--h) - 84px);max-width:calc(var(--w) - 10px);overflow:hidden;letter-spacing:.01em;text-shadow:0 1px 2px #000,0 0 8px rgba(0,0,0,.6);text-align:center;color:#f4e3b4;padding:0 2px;text-wrap:balance}
.sp em{display:none}
.sp__rib{position:absolute;top:-6px;right:9px;width:10px;height:42px;background:#a82846;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);box-shadow:0 0 10px rgba(168,40,70,.6)}
.sp__star{position:absolute;bottom:34px;left:50%;width:14px;height:14px;margin-left:-7px;background:#f1c76e;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%);filter:drop-shadow(0 0 6px rgba(255,200,110,.8))}
.sp__txt{position:absolute;top:36px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#ffd98a;opacity:.8;box-shadow:0 0 8px #ffd98a}
.sp.out{transform:translate3d(0,-26px,0) scale(1.12);z-index:5;filter:brightness(1.35) drop-shadow(0 18px 20px rgba(0,0,0,.75))}

<script>
/* ============================================================ core: helpers, state, persistence */
const A = window.A = {};
A.$ = (s, r = document) => r.querySelector(s);
A.$$ = (s, r = document) => [...r.querySelectorAll(s)];
A.h = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
A.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
A.uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
A.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
A.lerp = (a, b, t) => a + (b - a) * t;
A.ease = { out: t => 1 - Math.pow(1 - t, 3), inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2, smooth: t => t * t * (3 - 2 * t) };
A.hash = str => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0); };
A.rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
A.dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
A.reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
A.fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
A.plural = (n, one, few, many) => { const m = Math.abs(n) % 100, d = m % 10; return m > 10 && m < 20 ? many : d > 1 && d < 5 ? few : d === 1 ? one : many; };
A.vibrate = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------------------------------------------------------------- state */
const KEY = 'aisel-corner-v1';
const DEFAULT = () => ({
  v: 1, books: [], quotes: [], log: {}, acorns: 0, earned: 0, claimedDays: {}, claimedWeeks: {}, bonusDone: {},
  goal: { day: 20, week: 120 }, samples: true, locSeen: 0, bonusPoints: 12, welcomed: false,
  settings: { sound: true, music: true, vol: .8, portrait: null }, introSeen: false, fireTip: false
});
A.state = DEFAULT();
A.storageOk = true;
A.load = () => {
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); A.state = Object.assign(DEFAULT(), s, { settings: Object.assign(DEFAULT().settings, s.settings || {}), goal: Object.assign(DEFAULT().goal, s.goal || {}) }); return true; } } catch (e) { A.storageOk = false; }
  return false;
};
let saveT;
A.save = (now) => {
  clearTimeout(saveT);
  const go = () => { try { localStorage.setItem(KEY, JSON.stringify(A.state)); A.storageOk = true; } catch (e) { A.storageOk = false; if (A.toast) A.toast('Память телефона заполнена: сохрани копию в настройках'); } };
  if (now) go(); else saveT = setTimeout(go, 250);
};
addEventListener('pagehide', () => A.save(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) A.save(true); });

/* ---------------------------------------------------------------- derived numbers */
A.pagesOn = (key) => A.state.log[key] || 0;
A.pagesToday = () => A.pagesOn(A.dayKey());
A.pagesTotal = () => Object.values(A.state.log).reduce((s, v) => s + v, 0);
A.weekKeys = () => { const d = new Date(), wd = (d.getDay() + 6) % 7, out = []; for (let i = 0; i <= 6; i++) { const x = new Date(d); x.setDate(d.getDate() - wd + i); out.push(A.dayKey(x)); } return out; };
A.pagesWeek = () => A.weekKeys().reduce((s, k) => s + A.pagesOn(k), 0);
A.weekId = () => A.weekKeys()[0];
A.streak = () => { let n = 0; const d = new Date(); if (!A.pagesOn(A.dayKey(d))) d.setDate(d.getDate() - 1); while (A.pagesOn(A.dayKey(d)) > 0) { n++; d.setDate(d.getDate() - 1); } return n; };
A.doneBooks = () => A.state.books.filter(b => b.status === 'done');
A.points = () => A.doneBooks().length * 60 + Math.floor(A.pagesTotal() / 5) + (A.state.bonusPoints || 0);
A.bookById = id => A.state.books.find(b => b.id === id);

/* ---------------------------------------------------------------- acorns & stickers */
A.STICKERS = [
  { e: '🍄', n: 'Грибок', at: 0 }, { e: '🌿', n: 'Веточка', at: 0 }, { e: '🌙', n: 'Месяц', at: 0 }, { e: '✨', n: 'Искры', at: 0 },
  { e: '🕯️', n: 'Свеча', at: 8 }, { e: '🦋', n: 'Бабочка', at: 16 }, { e: '🍂', n: 'Лист', at: 26 }, { e: '☕', n: 'Чашка', at: 38 },
  { e: '🗝️', n: 'Ключик', at: 52 }, { e: '🪶', n: 'Перо', at: 68 }, { e: '🦊', n: 'Лисёнок', at: 86 }, { e: '🌹', n: 'Роза', at: 106 },
  { e: '🦉', n: 'Сова', at: 130 }, { e: '🏰', n: 'Замок', at: 160 }, { e: '🧚', n: 'Фея', at: 200 }, { e: '👑', n: 'Корона', at: 250 }
];
A.stickersOpen = () => A.STICKERS.filter(s => A.state.earned >= s.at);
A.addAcorns = (n, why) => {
  const before = A.stickersOpen().length;
  A.state.acorns += n; A.state.earned += n; A.save();
  A.refreshHud && A.refreshHud(true);
  const after = A.stickersOpen();
  if (after.length > before && A.onSticker) A.onSticker(after[after.length - 1]);
};

/* ---------------------------------------------------------------- covers */
A.coverHue = b => (b.cover && b.cover.hue != null) ? b.cover.hue : (A.hash(b.title + b.author) % 360);

const STORY = `# Фонарь на опушке

На самом краю леса, там, где тропинка превращается в мох, стоял старый фонарь. Никто не помнил, кто его зажёг. Он горел тихо, ровно, золотым светом, и мотыльки кружили вокруг него, как маленькие снежинки.

Каждый вечер к фонарю приходила девочка с книгой. Она садилась на корень большой сосны, раскрывала страницы и читала вслух, совсем тихо, чтобы не разбудить лес. Фонарь слушал. Он любил, когда читают про далёкие города и про корабли, которые возвращаются домой.

# Гость из тумана

Однажды в конце осени с реки поднялся туман. Он был густой, как молоко, и пах дождём. Девочка закрыла книгу и поняла, что не видит тропинки.

— Не бойся, — сказал кто-то совсем рядом.

Из тумана вышла лисица. Шерсть у неё была цвета сухих листьев, а глаза мерцали, как две свечи.

— Я знаю дорогу, — сказала она. — Но взамен прочитай мне то, что ты читала фонарю.

Девочка улыбнулась и открыла книгу снова. Лисица легла рядом, положила нос на лапы и закрыла глаза. Фонарь вспыхнул чуть ярче, словно тоже хотел услышать продолжение.

# Дорога домой

Когда последняя страница была прочитана, туман начал таять. Сначала показались ветки, потом мох, потом тропинка, блестящая от росы.

— Ты умеешь делать свет, — сказала лисица. — Не тот, что в фонаре. Другой. Он живёт в словах, и тот, кто его слышал, уже не заблудится.

Девочка пошла домой. Позади тихо горел фонарь, а в окнах деревни один за другим зажигались огни.

С тех пор в лесу говорят: если на опушке горит золотой свет и кто-то читает вслух, значит, всё хорошо. Значит, кто-то дома, кто-то слушает, и ночь не страшна.

Конец.`;

A.txt = (() => {
  let db = null, mem = {};
  const open = () => new Promise(res => { if (db !== null) return res(db); try { const rq = indexedDB.open('aisel-texts', 1); rq.onupgradeneeded = () => rq.result.createObjectStore('t'); rq.onsuccess = () => { db = rq.result; res(db); }; rq.onerror = () => { db = false; res(false); }; } catch (e) { db = false; res(false); } });
  const tx = async (mode, fn) => { const d = await open(); if (!d) return fn(null); return new Promise((res, rej) => { const t = d.transaction('t', mode), r = fn(t.objectStore('t')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); };
  return {
    put: async (id, text) => { const d = await open(); if (!d) { mem[id] = text; return; } await tx('readwrite', s => s.put(text, id)); },
    get: async (id) => { const d = await open(); if (!d) return mem[id] || ''; return (await tx('readonly', s => s.get(id))) || ''; },
    del: async (id) => { const d = await open(); if (!d) { delete mem[id]; return; } await tx('readwrite', s => s.delete(id)); },
    migrate: async () => { for (const b of A.state.books) if (b.text) { await A.txt.put(b.id, b.text); b.hasText = true; delete b.text; } A.save(); }
  };
})();

A.importer = (() => {
  const loaded = {};
  const need = (src) => loaded[src] || (loaded[src] = new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { delete loaded[src]; rej(new Error('lib')); }; document.head.appendChild(s); }));
  const tick = () => new Promise(r => setTimeout(r, 0));
  const clean = t => t.replace(/\r/g, '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  const thumb = (src, max = 360) => new Promise(res => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .8)); }; im.onerror = () => res(null); im.src = src; });
  const nameOf = f => f.name.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').trim();

  async function plain(file) {
    const buf = await file.arrayBuffer(); let t = new TextDecoder('utf-8').decode(buf);
    if ((t.match(/\uFFFD/g) || []).length > t.length * .002) t = new TextDecoder('windows-1251').decode(buf);
    return { title: nameOf(file), author: '', text: clean(t) };
  }

    const cont = await rd('META-INF/container.xml'), opfPath = (/full-path="([^"]+)"/.exec(cont) || [])[1]; if (!opfPath) throw new Error('epub');
    const opf = new DOMParser().parseFromString(await rd(opfPath), 'application/xml'), base = opfPath.includes('/') ? opfPath.replace(/[^/]+$/, '') : '';
    const g = (n) => { const e = opf.getElementsByTagNameNS('*', n)[0]; return e ? e.textContent.trim() : ''; };
    const items = {}; [...opf.getElementsByTagName('item')].forEach(i => items[i.getAttribute('id')] = i);
    const spine = [...opf.getElementsByTagName('itemref')].map(r => items[r.getAttribute('idref')]).filter(Boolean);
    const out = []; let n = 0;
    for (const it of spine) {
      const href = it.getAttribute('href'), type = it.getAttribute('media-type') || ''; if (!/html|xml/.test(type)) continue;
      const doc = new DOMParser().parseFromString(await rd(base + href), 'text/html'); doc.querySelectorAll('script,style,nav').forEach(x => x.remove());
      let buf = ''; const BLOCK = /^(P|DIV|H[1-6]|LI|BLOCKQUOTE|SECTION|ARTICLE|TR|PRE)$/;
      const walk = (nd) => { if (nd.nodeType === 3) { buf += nd.nodeValue.replace(/\s+/g, ' '); return; } if (nd.nodeType !== 1) return; const tg = nd.tagName; if (tg === 'BR') { buf += '\n'; return; } if (/^H[1-6]$/.test(tg)) buf += '\n\n# '; nd.childNodes.forEach(walk); if (BLOCK.test(tg)) buf += '\n\n'; };
      if (doc.body) walk(doc.body); out.push(buf.replace(/[ \t]*\n[ \t]*/g, '\n').replace(/\n{3,}/g, '\n\n').trim()); prog && prog(++n, spine.length); if (n % 4 === 0) await tick();
    }
    let cover = null; try {
      const meta = [...opf.getElementsByTagName('meta')].find(m => m.getAttribute('name') === 'cover'); let ci = meta ? items[meta.getAttribute('content')] : null; ci = ci || [...Object.values(items)].find(i => /cover-image/.test(i.getAttribute('properties') || ''));
      if (ci) { const f = zip.file(base + ci.getAttribute('href')) || zip.file(decodeURIComponent(base + ci.getAttribute('href'))); if (f) { const b64 = await f.async('base64'); cover = await thumb(`data:${ci.getAttribute('media-type') || 'image/jpeg'};base64,${b64}`); } }
    } catch (e) {}
    return { title: g('title') || nameOf(file), author: g('creator'), text: clean(out.filter(Boolean).join('\n\n')), cover };
  }

  async function pdf(file, prog) {
    await need('lib/pdf.min.js'); const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
    const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise; let info = {}; try { info = (await doc.getMetadata()).info || {}; } catch (e) {}
    const paras = []; let cur = '';
    const flush = () => { if (cur.trim()) paras.push(cur.trim()); cur = ''; };
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p), tc = await page.getTextContent(), lines = []; let ly = null, line = '', lh = 12, first = true;
      for (const it of tc.items) { if (!('str' in it)) continue; const y = it.transform[5], h = it.height || 10; if (ly !== null && Math.abs(y - ly) > h * .55) { lines.push({ s: line, y: ly, h: lh }); line = ''; } line += it.str; if (it.hasEOL) line += ' '; ly = y; lh = h || lh; }
      if (line) lines.push({ s: line, y: ly, h: lh });
      let prevY = null; for (const L of lines) { const s = L.s.replace(/\s+/g, ' ').trim(); if (!s || /^\d{1,4}$/.test(s) || /^-?\s*\d+\s*-?$/.test(s)) { continue; }
        const gap = prevY !== null ? Math.abs(prevY - L.y) : 0; if (prevY !== null && gap > L.h * 1.85) flush();
        if (cur && /[-­]$/.test(cur) && /^[a-zа-яё]/.test(s)) cur = cur.replace(/[-­]$/, '') + s; else cur += (cur ? ' ' : '') + s; prevY = L.y; first = false; }

  return {
    ACCEPT: '.txt,.md,.text,.epub,.pdf,text/plain,text/markdown,application/pdf,application/epub+zip',

/* ---------------------------------------------------------------- sheets */
A.sheet = (() => {
  const root = A.$('#sheets'); let z = 1;

    const bg = A.h('<div class="sheet-bg"></div>'), el = A.h(`<div class="sheet ${tall ? 'tall' : ''}"><div class="sheet__grab"></div>${noHead ? '' : `<div class="sheet__head"><h3>${title}</h3><button class="sheet__x" aria-label="Закрыть"><svg class="ico" viewBox="0 0 24 24"><use href="#i-close"/></svg></button></div>`}<div class="sheet__body">${html}</div></div>`);
    bg.style.zIndex = el.style.zIndex = 10 + (z += 2); root.append(bg, el); root.style.pointerEvents = 'auto';

    const close = () => { if (closed) return; closed = true; bg.classList.remove('in'); el.classList.remove('in'); el.style.transform = ''; setTimeout(() => { bg.remove(); el.remove(); if (!root.children.length) root.style.pointerEvents = 'none'; }, 750); onClose && onClose(); };
    bg.addEventListener('click', close); const x = A.$('.sheet__x', el); x && x.addEventListener('click', close);

    hd.forEach(h => { h.addEventListener('pointerdown', e => { if (e.target.closest('.sheet__x')) return; drag = true; sy = e.clientY; dy = 0; el.style.transition = 'none'; h.setPointerCapture(e.pointerId); });

      h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end); });

/* ---------------------------------------------------------------- the room is the router:
   touching an object glides the camera in, the object "opens" as a full-screen panel with an iris from that spot, and back reverses it */
const TABS = ['path', 'books', 'quotes', 'sky', 'potion', 'bag'];
const ROOMOF = { books: 'lib', potion: 'lab' }, MOOD = { books: 'books', potion: 'potion' };
const OBJ = { books: 'book', quotes: 'casket', potion: 'potion', sky: 'stars', path: 'scope', bag: 'bag' };
A.tab = 'room'; let moving = false;
const irisR = (x, y) => Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 40;
const curtain = A.$('#curtain');
function enterRoom(tab) {
  const name = ROOMOF[tab], prev = A.tab; if (prev === tab || moving) return;
  if (prev !== 'room' && !ROOMOF[prev]) { A.leave(); return setTimeout(() => A.go(tab), 1050); }
  moving = true; A.tab = tab; document.body.dataset.tab = tab; document.body.classList.add('inroom'); A.snd.setMood(MOOD[tab]); A.fab && A.fab.hide();
  const swap = () => { A.scene.setRoom(name, 1); A.scene.dolly(1.32); A.mods[tab] && A.mods[tab].show && A.mods[tab].show(); curtain.classList.remove('on'); setTimeout(() => { moving = false; }, 900); };
  A.snd.whoosh(1);
  if (prev === 'room') { A.scene.focus(OBJ[tab]); setTimeout(() => curtain.classList.add('on'), 330); setTimeout(swap, 980); } else { curtain.classList.add('on'); setTimeout(swap, 620); }
}
function enterCasket() {
  if (moving || A.tab === 'quotes') return; if (A.tab !== 'room') { A.leave(); return setTimeout(() => A.go('quotes'), 1100); }
  moving = true; A.tab = 'quotes'; document.body.dataset.tab = 'quotes'; document.body.classList.add('inroom'); A.snd.setMood('quotes'); A.snd.whoosh(1);
  A.scene.focus('casket').then(() => { A.casket.enter().then(() => { moving = false; }); });
}
function exitRoom() {
  if (moving) return; moving = true; const tab = A.tab; curtain.classList.add('on'); A.snd.whoosh(-1);
  setTimeout(() => { A.scene.returnMain(OBJ[tab]); A.tab = 'room'; document.body.dataset.tab = 'room'; document.body.classList.remove('inroom'); A.snd.setMood('room'); curtain.classList.remove('on'); setTimeout(() => { moving = false; }, 900); }, 620);
}
A.go = (tab, opt = {}) => {
  if (tab === 'room' || tab === 'back') return A.leave();
  if (ROOMOF[tab]) return enterRoom(tab);
  if (tab === 'quotes') return enterCasket();
  const from = A.tab, toEl = A.$('#v-' + tab); if (!toEl) return;
  if (from === tab && !opt.force) { toEl.scrollTo({ top: 0, behavior: 'smooth' }); A.snd.tap(); return; }
  if (moving) return; moving = true;
  const fromEl = from !== 'room' && A.$('#v-' + from), mod = A.mods[tab];
  A.tab = tab; document.body.dataset.tab = tab; document.body.classList.add('panel'); A.snd.setMood(tab); A.fab && A.fab.hide(); mod && mod.beforeShow && mod.beforeShow();
  const reveal = () => {
    const [x, y] = fromEl ? [innerWidth / 2, innerHeight / 2] : A.scene.focusPoint(), R = irisR(x, y);
    toEl.classList.add('active'); toEl.scrollTop = 0; toEl.style.zIndex = 2; A.snd.whoosh(1);
    if (!A.reduceMotion) {
      toEl.animate([{ clipPath: `circle(0px at ${x}px ${y}px)` }, { clipPath: `circle(${R}px at ${x}px ${y}px)` }], { duration: 950, easing: 'cubic-bezier(.5,0,.12,1)' });
      toEl.firstElementChild && toEl.firstElementChild.animate([{ transform: 'translateY(34px) scale(.97)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 1000, delay: 160, easing: 'cubic-bezier(.2,.9,.2,1)', fill: 'backwards' });

      ir.animate([{ opacity: .9, transform: 'scale(.4)' }, { opacity: .45, transform: `scale(${R / 14})`, offset: .7 }, { opacity: 0, transform: `scale(${R / 12})` }], { duration: 950, easing: 'cubic-bezier(.45,.05,.2,1)' });
      A.fx.fireflies(x, y, 14, 150);
    }
    if (fromEl) { fromEl.style.zIndex = 1; setTimeout(() => { fromEl.classList.remove('active'); }, 900); }
    setTimeout(() => { mod && mod.show && mod.show(); moving = false; }, 240);
  };
  if (fromEl || opt.instant) reveal(); else A.scene.focus(OBJ[tab]).then(reveal);
};
A.leave = () => {
  if (A.reader && A.reader.isOpen()) return A.reader.close();
  if (ROOMOF[A.tab]) return exitRoom();
  if (A.tab === 'quotes') { if (moving) return; moving = true; A.casket.leave().then(() => { A.scene.unfocus(); A.tab = 'room'; document.body.dataset.tab = 'room'; document.body.classList.remove('inroom'); A.snd.setMood('room'); moving = false; }); return; }
  if (A.tab === 'room' || moving) return; moving = true; const tab = A.tab, el = A.$('#v-' + tab); A.fab && A.fab.hide();
  const [x, y] = A.scene.focusPoint(), R = irisR(x, y); A.snd.whoosh(-1);
  const done = () => { el.classList.remove('active'); el.getAnimations().forEach(a => a.cancel()); el.style.clipPath = ''; A.tab = 'room'; document.body.dataset.tab = 'room'; document.body.classList.remove('panel'); A.scene.unfocus(); A.snd.setMood('room'); moving = false; };
  A.scene.lock(true); document.body.classList.remove('panel');
  if (A.reduceMotion) return done();
  el.animate([{ clipPath: `circle(${R}px at ${x}px ${y}px)`, opacity: 1 }, { clipPath: `circle(0px at ${x}px ${y}px)`, opacity: .6 }], { duration: 720, easing: 'cubic-bezier(.6,0,.2,1)', fill: 'forwards' }).finished.then(done);
  setTimeout(() => A.scene.unfocus(), 280);
};

    A.$('.lib__add', layer).addEventListener('click', () => { A.snd.coin(); A.fx.sparks(innerWidth / 2, innerHeight * .88, 16); A.mods.books.editBook(); });

    const inner = rows.map(r => A.$('.shelf3__in', r)); inner.forEach(n => { n.innerHTML = ''; n._w = 0; n.style.transform = ''; n._x = 0; });
    list.forEach(b => {
      const ph = C.rows[0][3] - 70, d = dims(b, ph), tgt = inner.reduce((m, n) => n._w < m._w ? n : m, inner[0]), hh = hue(b), len = b.title.length;
      const fs = Math.max(20, Math.min(30, Math.round((d.h - 120) / Math.max(7, len * .56))));

    const settle = () => { cancelAnimationFrame(raf); const step = () => { const l = lim(), over = inner._x > 0 ? 0 - inner._x : inner._x < l ? l - inner._x : 0; vel *= .94; set(inner._x + vel + over * .16); if (Math.abs(vel) > .3 || Math.abs(over) > .5) raf = requestAnimationFrame(step); }; raf = requestAnimationFrame(step); };

    cup: id => `${sleeve(id)}${wrist(id)}

      ${finger('M88 156 C86 112 88 74 98 52 C104 40 122 42 124 56 C128 90 124 130 120 160 Z', id)}${nail(112, 50, 8, 10)}
      ${finger('M122 156 C122 118 128 92 138 76 C146 64 160 70 158 84 C156 116 150 140 148 162 Z', id)}
      ${finger('M148 164 C150 136 158 114 168 104 C176 96 188 102 184 114 C180 140 172 156 166 172 Z', id)}
      <path d="M96 150 C94 112 98 80 106 58" fill="none" stroke="rgba(255,225,190,.45)" stroke-width="3" stroke-linecap="round"/>`,
    open: id => `${sleeve(id)}${wrist(id)}
      ${finger('M62 170 C40 150 36 110 50 70 C56 56 76 56 78 72 C82 104 80 140 82 172 Z', id)}

    document.body.appendChild(el); box = A.$('#ckClosed', el); lid = A.$('#ckOpen', el); cards = A.$('#ckCards', el); hands = A.$('#ckHands', el); hintEl = A.$('#ckHint', el); cnt = A.$('#ckCnt', el);

    el.addEventListener('pointerdown', e => { if (!open || busy) return; st = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false, id: e.pointerId, tgt: e.target.closest('.ck__card') }; clearTimeout(hold); if (st.tgt) hold = setTimeout(() => { if (st && !st.moved) { st.moved = true; const q = list()[idx]; if (q) { A.vibrate(20); A.mods.quotes.view(q.id); } } }, 620); });
    el.addEventListener('pointermove', e => { if (st && Math.hypot(e.clientX - st.x, e.clientY - st.y) > 12) { st.moved = true; clearTimeout(hold); } });
    const end = e => { clearTimeout(hold); if (!st) return; const s = st; st = null; const dx = e.clientX - s.x, dt = performance.now() - s.t;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(e.clientY - s.y)) go(dx < 0 ? 1 : -1); else if (!s.moved && dt < 450) go(e.clientX > innerWidth * .35 ? 1 : -1); };

    box.animate([{ opacity: 0, transform: 'translateY(60px) scale(.9)' }, { opacity: 1, transform: 'none' }], { duration: 900, easing: 'cubic-bezier(.2,.9,.2,1)', fill: 'forwards' }); await wait(700);

  }
  function refresh() {
    if (!el) return; const g = A.state.goal, t = A.pagesToday(), p = Math.min(1, t / g.day);
