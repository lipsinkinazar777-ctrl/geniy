<div id="stageBg" aria-hidden="true"></div>
<div id="stage" aria-label="Комната с книгой на столе">
  <div id="room" data-room="main">
    <img class="plate" id="pl-main" alt="" draggable="false" decoding="async">
    <img class="plate" id="pl-lab" alt="" draggable="false" decoding="async">
    <img class="plate" id="pl-lib" alt="" draggable="false" decoding="async">
    <img class="plate" id="pl-cit" alt="" draggable="false" decoding="async">
    <div id="pageTxt" class="r-main" aria-hidden="true"></div>
    <div id="hsFx" class="r-main" aria-hidden="true"></div>
    <canvas id="fireCv" class="r-main" width="720" height="820" aria-hidden="true"></canvas>
    <canvas id="fireGl" class="r-main" aria-hidden="true"></canvas>
    <div id="labels" class="r-main" aria-hidden="true"></div>
    <div id="mbox" class="r-main" aria-hidden="true"></div>
    <div id="labLayer" class="r-lab"></div>
    <div id="libLayer" class="r-lib"></div>
  </div>
</div>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="tint" aria-hidden="true"></div>
<div id="vignette" aria-hidden="true"></div>
<div id="hint" aria-hidden="true"></div>
<div id="curtain" aria-hidden="true"></div>

<!-- ENTRANCE: the flythrough with its own sound. No button: the gate opens and she walks into the hall. -->
<div id="intro" aria-label="Вход">
  <div class="in__bg" id="introBg"></div>
  <canvas class="in__amb" id="introAmb" aria-hidden="true"></canvas>
  <canvas class="in__seq" id="introSeq" width="360" height="640" aria-hidden="true"></canvas>
  <video id="introV" playsinline webkit-playsinline preload="auto" poster="video/poster.jpg" disablepictureinpicture>
    <source src="video/intro.mp4" type="video/mp4">
    <source src="video/intro.webm" type="video/webm">
  </video>
  <div class="in__shade"></div>
  <div class="in__title"><p class="in__small">тихая комната ждёт</p><h1>Уголок принцессы <em>Айсель</em></h1><i class="in__rule"></i></div>
  <p class="in__snd" id="introSnd"><svg viewBox="0 0 24 24" class="ico"><use href="#i-sound"/></svg><span>коснись экрана, чтобы услышать</span></p>
  <button class="in__skip" id="introSkip">пропустить</button>
</div>

<div id="hands" aria-hidden="true"></div>
<div id="lib3d" aria-hidden="false"></div>

<div id="app" hidden>
  <button id="back" aria-label="Назад к столу"><svg viewBox="0 0 24 24" class="ico"><path d="M14.500 5.500 8 12l6.500 6.500" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <main id="views">
    <section class="view" id="v-books" data-tab="books"></section>
    <section class="view" id="v-quotes" data-tab="quotes"></section>
    <section class="view" id="v-potion" data-tab="potion"></section>
    <section class="view" id="v-bag" data-tab="bag"></section>
  </main>
</div>

<div id="iris" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite"></div>
