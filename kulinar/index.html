<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Гений кухни — премиальная кулинарная книга</title>
<meta name="theme-color" content="#0f0c09">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0c09;--bg2:#161210;--card:#1c1713;--card2:#241d17;--line:#33291f;--tx:#f4ebdc;--mut:#a99a84;--gold:#d9ae5f;--gold2:#f0cf8e;--ember:#d1553a;--green:#5fae7e;--blue:#6f9bd6;--shadow:0 20px 50px rgba(0,0,0,.45);--r:20px;
--serif:'Playfair Display',Georgia,'Times New Roman',serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
:root[data-theme=light]{--bg:#f7f1e6;--bg2:#efe6d5;--card:#fffaf0;--card2:#f3e9d6;--line:#e0d2b8;--tx:#2a2016;--mut:#7d6c55;--gold:#a97a1f;--gold2:#8a6112;--ember:#c04327;--shadow:0 16px 40px rgba(90,65,20,.15)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.55 var(--sans);min-height:100vh;
background-image:radial-gradient(900px 500px at 85% -10%,rgba(217,174,95,.10),transparent 60%),radial-gradient(700px 400px at -10% 20%,rgba(209,85,58,.07),transparent 60%);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--tx)}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;line-height:1.15;letter-spacing:.2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
/* header */
header.top{position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:18px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:800;font-size:22px;white-space:nowrap}
.logo i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--ember));font-style:normal;font-size:19px;box-shadow:0 6px 18px rgba(209,85,58,.4)}
.logo b{background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
nav.main{display:flex;gap:4px;margin-left:10px;overflow-x:auto;scrollbar-width:none}
nav.main a{padding:8px 14px;border-radius:999px;color:var(--mut);font-weight:500;white-space:nowrap;transition:.2s}
nav.main a:hover{color:var(--tx);background:var(--card)}
nav.main a.on{color:#1a1208;background:linear-gradient(135deg,var(--gold2),var(--gold));font-weight:600}
.top-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.sbox{position:relative}
.sbox input{width:260px;padding:10px 14px 10px 38px;background:var(--card);border:1px solid var(--line);border-radius:999px;outline:none;transition:.2s}
.sbox input:focus{border-color:var(--gold);width:320px;box-shadow:0 0 0 4px rgba(217,174,95,.12)}
.sbox:before{content:'⌕';position:absolute;left:14px;top:50%;transform:translateY(-52%);font-size:19px;color:var(--mut)}
.ibtn{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:17px;transition:.2s}
.ibtn:hover{border-color:var(--gold)}
#sres{position:absolute;right:0;top:48px;width:420px;max-width:92vw;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:none;max-height:70vh;overflow-y:auto}
#sres a{display:flex;gap:12px;padding:11px 14px;align-items:center;border-bottom:1px solid var(--line)}
#sres a:hover{background:var(--card2)}
#sres small{color:var(--mut)}
/* common */
main{padding:28px 0 90px;min-height:70vh}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mut);white-space:nowrap}
.pill.on,button.pill:hover{border-color:var(--gold);color:var(--gold2)}
button.pill.on{background:rgba(217,174,95,.12)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:600;transition:.2s;border:1px solid var(--line);background:var(--card)}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1208;border-color:transparent}
.btn.gold:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.18em;font-size:12px;font-weight:600}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;margin:46px 0 18px;gap:16px;flex-wrap:wrap}
.sec-h h2{font-size:32px}
.sec-h a{color:var(--gold);font-weight:600}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.muted{color:var(--mut)}
/* hero */
.hero{position:relative;border-radius:32px;overflow:hidden;padding:64px 56px;background:linear-gradient(120deg,rgba(15,12,9,.2),rgba(15,12,9,.0)),radial-gradient(600px 400px at 85% 30%,rgba(217,174,95,.28),transparent 60%),linear-gradient(135deg,#2a1d12,#150f0a 70%);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero h1{font-size:clamp(36px,5.5vw,68px);max-width:760px;margin:14px 0 18px}
.hero h1 em{font-style:italic;color:var(--gold2)}
.hero p{max-width:560px;color:#cdbfa8;font-size:17px;margin-bottom:28px}
.hero .big{position:absolute;right:40px;top:50%;transform:translateY(-50%);font-size:230px;opacity:.9;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6));pointer-events:none}
:root[data-theme=light] .hero{background:linear-gradient(135deg,#fff3da,#f0dcb2)}
:root[data-theme=light] .hero p{color:#6a563a}
.hero .row{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:34px;margin-top:38px;flex-wrap:wrap}
.stats b{display:block;font-family:var(--serif);font-size:34px;color:var(--gold2)}
.stats span{color:var(--mut);font-size:13px}
/* tiles */
.tiles{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.tile{position:relative;padding:22px;border-radius:22px;background:var(--card);border:1px solid var(--line);transition:.25s;overflow:hidden;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end}
.tile:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:var(--shadow)}
.tile .e{position:absolute;right:14px;top:8px;font-size:60px;opacity:.95}
.tile h3{font-size:21px}
.tile p{color:var(--mut);font-size:13px;margin-top:4px}
.tile:before{content:'';position:absolute;inset:0;background:radial-gradient(180px 120px at 100% 0,var(--c,rgba(217,174,95,.2)),transparent 70%);opacity:.35}
/* recipe card */
.rc{cursor:pointer;transition:.25s;display:flex;flex-direction:column;position:relative}
.rc:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--gold)}
.rc .ph{height:140px;display:grid;place-items:center;font-size:68px;position:relative;background:linear-gradient(135deg,var(--c1,#3a2a1a),var(--c2,#1b140e))}
.rc .ph:after{content:'';position:absolute;inset:0;background:radial-gradient(120px 80px at 70% 20%,rgba(255,255,255,.14),transparent)}
.rc .ph span{filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));position:relative;z-index:1}
.rc .fv{position:absolute;right:10px;top:10px;z-index:2;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;backdrop-filter:blur(6px);font-size:16px;color:#fff}
.rc .fv.on{color:#ff6b6b;background:rgba(0,0,0,.65)}
.rc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
.rc h3{font-size:19px}
.rc .cu{font-size:12px;color:var(--gold);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.rc p{color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:10px;color:var(--mut);font-size:12.5px;margin-top:auto;flex-wrap:wrap}
.meta b{color:var(--tx);font-weight:600}
.lvl i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--line);margin-right:2px}
.lvl i.on{background:var(--gold)}
/* filters */
.filters{display:flex;flex-direction:column;gap:12px;margin:18px 0 26px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.sc{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select,.field,select.field{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;outline:none}
.toolbar input:focus,.field:focus{border-color:var(--gold)}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.page-h h1{font-size:clamp(30px,4vw,46px)}
.page-h p{color:var(--mut);max-width:640px;margin-top:8px}
/* tabs */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:22px 0;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:12px 18px;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--gold2);border-color:var(--gold)}
/* recipe page */
.rp{display:grid;gap:30px;grid-template-columns:1fr 1.25fr}
.rhero{border-radius:28px;padding:34px;background:linear-gradient(135deg,var(--c1,#3a2a1a),var(--c2,#1b140e));position:relative;overflow:hidden;border:1px solid var(--line);margin-bottom:26px}
.rhero .em{position:absolute;right:30px;top:20px;font-size:130px;opacity:.95;filter:drop-shadow(0 20px 30px rgba(0,0,0,.5))}
.rhero h1{font-size:clamp(30px,4.5vw,52px);max-width:80%;color:#fff}
.rhero p{color:#e8dcc5;max-width:560px;margin:10px 0 18px}
.rhero .pill{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.18);color:#f0e4cd}
.back{color:var(--mut);margin-bottom:14px;display:inline-block}
.back:hover{color:var(--gold)}
.ing li{list-style:none;display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);align-items:center;cursor:pointer}
.ing li input{accent-color:var(--gold);width:18px;height:18px}
.ing li.done span{text-decoration:line-through;color:var(--mut)}
.ing li b{margin-left:auto;color:var(--gold2);white-space:nowrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.stepper button{width:36px;height:36px;font-size:18px}
.stepper button:hover{background:var(--card2)}
.stepper span{min-width:36px;text-align:center;font-weight:600}
.steps li{list-style:none;display:flex;gap:16px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:12px;counter-increment:s}
.steps li:before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1208;font-weight:700;display:grid;place-items:center;font-family:var(--serif)}
.steps{counter-reset:s}
.tip{padding:16px 18px;border-radius:16px;background:rgba(217,174,95,.1);border:1px solid rgba(217,174,95,.35);margin-top:14px}
.tip b{color:var(--gold2)}
.nut{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.nut div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.nut b{display:block;font-family:var(--serif);font-size:22px;color:var(--gold2)}
.nut span{font-size:12px;color:var(--mut)}
/* cook mode */
#cook{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;padding:20px}
#cook.on{display:flex}
#cook .cb{flex:1;display:grid;place-items:center;text-align:center;padding:20px}
#cook .cb p{font-family:var(--serif);font-size:clamp(24px,4vw,44px);line-height:1.35;max-width:900px}
#cook .cb small{color:var(--gold);letter-spacing:.2em;text-transform:uppercase;display:block;margin-bottom:20px}
#cook .bar{height:5px;background:var(--line);border-radius:5px}
#cook .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--ember));border-radius:5px;transition:.3s}
#cook .ctl{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-top:14px;flex-wrap:wrap}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:90;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal.on{display:flex}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:24px;width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.mbox .mh{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.mbox .mb{padding:18px 22px;overflow-y:auto}
.mlist button{display:flex;width:100%;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;text-align:left}
.mlist button:hover{background:var(--card2)}
/* wiki */
.acc{border:1px solid var(--line);border-radius:18px;background:var(--card);margin-bottom:12px;overflow:hidden}
.acc>button{display:flex;gap:14px;align-items:center;width:100%;padding:16px 20px;text-align:left}
.acc>button .e{font-size:30px}
.acc>button h3{font-size:20px}
.acc>button small{color:var(--mut);display:block;font-family:var(--sans);font-size:13px;font-weight:400}
.acc>button:after{content:'＋';margin-left:auto;font-size:20px;color:var(--gold)}
.acc.open>button:after{content:'－'}
.acc .ab{display:none;padding:4px 20px 20px;color:#d7cab3}
:root[data-theme=light] .acc .ab{color:#4a3b27}
.acc.open .ab{display:block}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;margin:12px 0}
.kv b{color:var(--gold)}
.cutlist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:12px}
.cut{padding:14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.cut h4{font-size:16px;margin-bottom:4px;color:var(--gold2)}
.cut p{font-size:13px;color:var(--mut)}
.cut em{display:block;margin-top:6px;font-style:normal;font-size:12px;color:var(--green)}
.timeline{border-left:2px solid var(--line);margin:14px 0 14px 8px;padding-left:20px}
.timeline li{list-style:none;position:relative;padding:5px 0 12px;color:#d7cab3}
:root[data-theme=light] .timeline li{color:#4a3b27}
.timeline li:before{content:'';position:absolute;left:-27px;top:11px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px var(--bg)}
/* doneness */
.done-wrap{padding:26px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.steakviz{height:150px;border-radius:70px 70px 70px 70px/60px;margin:18px 0;position:relative;overflow:hidden;box-shadow:inset 0 0 0 10px #4a2b17,0 10px 30px rgba(0,0,0,.5);transition:.4s}
.steakviz:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(0,0,0,.18) 22px 26px);}
.dn{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--gold);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
/* calculator */
.two{display:grid;gap:22px;grid-template-columns:1fr 1fr}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px}
.panel h3{margin-bottom:14px;font-size:22px}
.frm{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.frm label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.frm .full{grid-column:1/-1}
.field{width:100%}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:600;color:var(--mut)}
.seg button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1208}
.ring{position:relative;width:200px;height:200px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-family:var(--serif);font-size:38px;display:block;line-height:1}
.ring .c span{font-size:12px;color:var(--mut)}
.mbar{margin:12px 0}
.mbar .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.mbar .tr{height:9px;border-radius:9px;background:var(--bg2);overflow:hidden}
.mbar .tr i{display:block;height:100%;border-radius:9px;transition:.4s}
.big-n{font-family:var(--serif);font-size:46px;color:var(--gold2);line-height:1}
.res3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.res3 div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.res3 b{display:block;font-family:var(--serif);font-size:22px}
.res3 span{font-size:12px;color:var(--mut)}
.dl li{list-style:none;display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.dl li span{flex:1}
.dl li small{color:var(--mut);display:block}
.x{color:var(--mut);width:28px;height:28px;border-radius:50%}
.x:hover{background:var(--card2);color:var(--ember)}
.sugg{position:relative}
.sugg .list{position:absolute;left:0;right:0;top:100%;z-index:10;background:var(--bg2);border:1px solid var(--line);border-radius:12px;max-height:260px;overflow:auto;box-shadow:var(--shadow);margin-top:4px}
.sugg .list button{display:flex;justify-content:space-between;width:100%;padding:9px 12px;text-align:left;gap:10px;font-size:14px}
.sugg .list button:hover{background:var(--card2)}
/* planner */
.pl-h{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:18px 0}
.week{display:grid;grid-template-columns:repeat(7,minmax(160px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:160px}
.day.today{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,174,95,.14)}
.day h4{font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.day h4 small{color:var(--mut);font-family:var(--sans);font-weight:500;font-size:12px}
.slot{background:var(--bg2);border-radius:12px;padding:8px 10px;min-height:56px}
.slot .sh{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.slot .sh button{color:var(--gold);font-size:18px;line-height:1}
.pm{display:flex;gap:6px;align-items:center;font-size:13px;padding:3px 0}
.pm a{flex:1;line-height:1.25;cursor:pointer}
.pm a:hover{color:var(--gold2)}
.pm small{color:var(--mut);display:block}
.pm button{color:var(--mut);font-size:14px}
.dsum{font-size:12px;color:var(--mut);text-align:center;padding-top:4px;border-top:1px solid var(--line)}
.dsum b{color:var(--gold2)}
.shop li{list-style:none;display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.shop li.done span{text-decoration:line-through;color:var(--mut)}
.shop input{accent-color:var(--gold);width:17px;height:17px}
.shop b{margin-left:auto;color:var(--gold2)}
.empty{padding:50px 20px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:20px}
.empty .e{font-size:54px}
/* toast */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#1a1208;padding:11px 20px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:200;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translateX(-50%)}
/* bottom nav (mobile) */
.bnav{display:none}

function searchRecipes(q,f={}){
  const n=norm(q).trim();const words=n.split(/\s+/).filter(Boolean);
  return RECIPES.map(r=>{
    const hay=norm(r.name+' '+r.desc+' '+(CUISINES[r.cu]||{}).n+' '+(CATS[r.cat]||'')+' '+r.ing.map(i=>i.n).join(' '));
    let sc=0;
    if(words.length){
      for(const w of words){
        if(norm(r.name).includes(w))sc+=10;else if(hay.includes(w))sc+=3;else return null;
      }
    }
    return{r,sc};
  }).filter(Boolean).sort((a,b)=>b.sc-a.sc).map(x=>x.r);
}

const timers=[];
function startTimer(min,label){
  const end=Date.now()+min*60000;const id=Date.now();timers.push({id,end,label});toast('⏱ Таймер '+min+' мин запущен');tickTimers();
}
function tickTimers(){
  let box=$('#timers');if(!box){box=document.createElement('div');box.id='timers';box.style.cssText='position:fixed;right:14px;bottom:80px;z-index:150;display:flex;flex-direction:column;gap:8px';document.body.appendChild(box)}
  box.innerHTML=timers.map(t=>{const s=Math.max(0,Math.round((t.end-Date.now())/1000));return `<div style="background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center">⏱ <b style="font-family:var(--serif);font-size:20px">${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}</b><small class="muted">${esc(t.label||'')}</small><button class="x" onclick="stopTimer(${t.id})">✕</button></div>`}).join('');
  for(const t of [...timers])if(t.end<=Date.now()){beep();toast('⏰ Время вышло: '+(t.label||'таймер'));stopTimer(t.id)}
  clearTimeout(tickTimers.t);if(timers.length)tickTimers.t=setTimeout(tickTimers,1000);
}
function stopTimer(id){const i=timers.findIndex(t=>t.id===id);if(i>=0)timers.splice(i,1);tickTimers()}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start(a.currentTime+d);o.stop(a.currentTime+d+.15)})}catch(e){}}
function timerBtn(step){
  const m=step.match(/(\d+)(?:\s*[–-]\s*(\d+))?\s*(мин|час)/);if(!m)return'';
  let v=+(m[2]||m[1]);if(m[3]==='час')v*=60;if(v>240)return'';
  return ` <button class="pill" style="cursor:pointer" onclick="startTimer(${v},'${esc(step).slice(0,30).replace(/'/g,'')}…')">⏱ ${v} мин</button>`;
}

const today=()=>ymd(new Date());
let diaryDate=today();
function calcTargets(){
  const p=S.prof;const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161);const tdee=bmr*p.act;
  const mult={cut:.8,cutl:.9,keep:1,bulk:1.1}[p.goal];let kcal=Math.round(tdee*mult);
  const prot=Math.round(p.w*(p.goal==='cut'||p.goal==='cutl'?2:p.goal==='bulk'?1.8:1.6));
  const fat=Math.round(kcal*.28/9);const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,fat,carb,water:Math.round(p.w*33),bmi:+(p.w/Math.pow(p.h/100,2)).toFixed(1)}
}

   <label class="full">Цель<select class="field" id="pgoal"><option value="cut">Похудение (−20%)</option><option value="cutl">Мягкое похудение (−10%)</option><option value="keep">Поддержание веса</option><option value="bulk">Набор массы (+10%)</option></select></label></div>
   <div id="cres"></div></div>
  <div class="panel"><h3>2. Дневник питания</h3>
   <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><button class="ibtn" onclick="diaryNav(-1)">‹</button><input type="date" class="field" id="dd" value="${diaryDate}" style="flex:1"><button class="ibtn" onclick="diaryNav(1)">›</button></div>
   <div id="dsum"></div>
   <div class="sugg" style="margin:14px 0 6px"><input class="field" id="fs" placeholder="🔎 Найти продукт (курица, рис, яблоко…)" autocomplete="off"><div class="list" id="fl" style="display:none"></div></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" onclick="diaryRecipeModal()">+ Блюдо из рецептов</button><button class="btn sm" onclick="diaryCustomModal()">+ Свой продукт</button></div>
   <ul class="dl" id="dlist" style="margin-top:12px"></ul></div></div>
  <div class="sec-h"><h2>Калорийность и КБЖУ продуктов (на 100 г)</h2></div>
  <div class="panel"><input class="field" id="ft" placeholder="Фильтр по названию…" style="max-width:320px;margin-bottom:12px"><div style="overflow-x:auto;max-height:480px;overflow-y:auto"><table class="t" id="ftab"></table></div></div>`;
  $('#pact').value=p.act;$('#pgoal').value=p.goal;
  const upd=()=>{S.prof={sex:$('#sx .on').dataset.v,age:+$('#pa').value||30,h:+$('#ph').value||175,w:+$('#pw').value||70,act:+$('#pact').value,goal:$('#pgoal').value};save('prof');drawCalc();drawDiary()};
  ['pa','ph','pw','pact','pgoal'].forEach(i=>$('#'+i).oninput=upd);
  $('#sx').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#sx .on').classList.remove('on');b.classList.add('on');upd()};
  $('#dd').onchange=e=>{diaryDate=e.target.value||today();drawDiary()};
  const fs=$('#fs'),fl=$('#fl');
  fs.oninput=()=>{const q=norm(fs.value);if(!q){fl.style.display='none';return}const r=FOODS.filter(f=>norm(f.n).includes(q)).slice(0,10);fl.innerHTML=r.map(f=>`<button onclick="diaryFood('${f.id}')"><span>${esc(f.n)}</span><small class="muted">${f.k} ккал/100 г</small></button>`).join('')||'<button><span class="muted">Не найдено</span></button>';fl.style.display='block'};
  fs.onblur=()=>setTimeout(()=>fl.style.display='none',200);
  const drawT=q=>{$('#ftab').innerHTML='<tr><th>Продукт</th><th>Ккал</th><th>Б</th><th>Ж</th><th>У</th></tr>'+FOODS.filter(f=>norm(f.n).includes(norm(q))).map(f=>`<tr><td>${esc(f.n)}</td><td><b>${f.k}</b></td><td>${f.p}</td><td>${f.f}</td><td>${f.c}</td></tr>`).join('')};
  drawT('');$('#ft').oninput=e=>drawT(e.target.value);
  drawCalc();drawDiary();
}
function drawCalc(){
  const t=calcTargets();const goalN={cut:'Похудение',cutl:'Мягкое похудение',keep:'Поддержание',bulk:'Набор массы'}[S.prof.goal];
  $('#cres').innerHTML=`<div style="margin-top:20px;text-align:center"><div class="eyebrow">Ваша цель — ${goalN}</div><div class="big-n" style="margin:8px 0">${t.kcal}<small style="font-size:18px;color:var(--mut)"> ккал/день</small></div></div>
  <div class="res3"><div><b style="color:#d1553a">${t.prot} г</b><span>Белки</span></div><div><b style="color:var(--gold)">${t.fat} г</b><span>Жиры</span></div><div><b style="color:#6f9bd6">${t.carb} г</b><span>Углеводы</span></div></div>
  <div class="res3"><div><b>${t.bmr}</b><span>Базовый обмен</span></div><div><b>${t.tdee}</b><span>Расход за день</span></div><div><b>${t.water} мл</b><span>Вода</span></div></div>
  <p class="muted" style="margin-top:14px;font-size:13px">ИМТ: <b style="color:var(--tx)">${t.bmi}</b> — ${bmiLabel(t.bmi)}. Расчёт ориентировочный; при заболеваниях и беременности проконсультируйтесь с врачом.</p>`;
}
function bar(l,v,max,col,u='г'){const pc=Math.min(100,max?v/max*100:0);return `<div class="mbar"><div class="l"><span>${l}</span><span><b>${Math.round(v)}</b> / ${max} ${u}</span></div><div class="tr"><i style="width:${pc}%;background:${col}"></i></div></div>`}
function drawDiary(){
  const t=calcTargets();const tot=dayTotals(diaryDate);const items=S.diary[diaryDate]||[];
  const R=84,C=2*Math.PI*R;const pc=Math.min(1,tot.k/t.kcal);const over=tot.k>t.kcal;
  $('#dsum').innerHTML=`<div class="ring"><svg width="200" height="200"><circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--bg2)" stroke-width="16"/><circle cx="100" cy="100" r="${R}" fill="none" stroke="${over?'#d1553a':'url(#g)'}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc)}"/><defs><linearGradient id="g"><stop offset="0" stop-color="#f0cf8e"/><stop offset="1" stop-color="#d9ae5f"/></linearGradient></defs></svg><div class="c"><div><b>${Math.round(tot.k)}</b><span>из ${t.kcal} ккал</span><br><span style="color:${over?'#d1553a':'var(--green)'}">${over?'Перебор '+Math.round(tot.k-t.kcal):'Осталось '+Math.round(t.kcal-tot.k)}</span></div></div></div>
  ${bar('Белки',tot.p,t.prot,'#d1553a')}${bar('Жиры',tot.f,t.fat,'#d9ae5f')}${bar('Углеводы',tot.c,t.carb,'#6f9bd6')}`;
  $('#dlist').innerHTML=items.length?items.map((i,n)=>`<li><span>${esc(i.name)}<small>${i.g?i.g+' г · ':''}${i.s?i.s+' порц. · ':''}Б ${Math.round(i.p||0)} · Ж ${Math.round(i.f||0)} · У ${Math.round(i.c||0)}</small></span><b>${Math.round(i.k)}</b><button class="x" onclick="diaryDel(${n})">✕</button></li>`).join(''):'<div class="muted" style="padding:10px 0">Пока пусто — добавьте продукт или блюдо.</div>';
}
function diaryPush(it){(S.diary[diaryDate]=S.diary[diaryDate]||[]).push(it);save('diary');drawDiary();toast('Добавлено в дневник')}
function diaryDel(n){S.diary[diaryDate].splice(n,1);save('diary');drawDiary()}
function diaryNav(d){diaryDate=ymd(addDays(diaryDate+'T12:00:00',d));$('#dd').value=diaryDate;drawDiary()}
function diaryFood(id){
  const f=FOODS.find(x=>x.id===id);$('#fl').style.display='none';
  openModal(f.n,`<p class="muted">На 100 г: ${f.k} ккал · Б ${f.p} · Ж ${f.f} · У ${f.c}</p><div class="frm" style="margin:14px 0"><label class="full">Масса, г<input class="field" id="gm" type="number" value="100" min="1"></label></div><div id="gpv" class="big-n" style="margin-bottom:14px">${f.k}</div><button class="btn gold" onclick="addFood('${id}')">Добавить в дневник</button>`);
  $('#gm').oninput=e=>$('#gpv').textContent=Math.round(f.k*e.target.value/100)+' ккал';$('#gm').focus();
}
function addFood(id){const f=FOODS.find(x=>x.id===id);const g=+$('#gm').value||100,m=g/100;closeModal();$('#fs').value='';diaryPush({name:f.n,g,k:f.k*m,p:f.p*m,f:f.f*m,c:f.c*m})}
function diaryAddRecipe(id){const r=byId(id);if(!diaryDate)diaryDate=today();diaryDate=today();(S.diary[diaryDate]=S.diary[diaryDate]||[]).push({name:r.name,s:1,k:r.kcal});save('diary');toast('Порция добавлена в дневник на сегодня 🔥')}
function diaryRecipeModal(){
  openModal('Добавить блюдо',`<input class="field" id="drq" placeholder="Поиск рецепта…" style="margin-bottom:10px"><div class="mlist" id="drl"></div>`);
  const draw=q=>{$('#drl').innerHTML=searchRecipes(q).filter(r=>r.cat!=='sauce').slice(0,30).map(r=>`<button onclick="closeModal();diaryPush({name:'${esc(r.name).replace(/'/g,'')}',s:1,k:${r.kcal}})"><span style="font-size:26px">${r.em}</span><div><b>${esc(r.name)}</b><br><small class="muted">${r.kcal} ккал / порция</small></div></button>`).join('')};
  draw('');$('#drq').oninput=e=>draw(e.target.value);
}
function diaryCustomModal(){
  openModal('Свой продукт',`<div class="frm"><label class="full">Название<input class="field" id="cn" placeholder="Например: домашний борщ"></label><label>Ккал<input class="field" id="ck" type="number" min="0"></label><label>Белки, г<input class="field" id="cp" type="number" min="0"></label><label>Жиры, г<input class="field" id="cf" type="number" min="0"></label><label>Углеводы, г<input class="field" id="cc" type="number" min="0"></label></div><p style="margin-top:14px"><button class="btn gold" onclick="addCustom()">Добавить</button></p>`);
}
function addCustom(){const n=$('#cn').value.trim()||'Свой продукт',k=+$('#ck').value;if(!k){toast('Укажите калории');return}closeModal();diaryPush({name:n,k,p:+$('#cp').value||0,f:+$('#cf').value||0,c:+$('#cc').value||0})}

/* ---------- ПЛАНЕР ---------- */
let weekStart=monday(new Date());
function vPlanner(el){
  const days=[...Array(7)].map((_,i)=>addDays(weekStart,i));const a=days[0],b=days[6];
  const title=`${a.getDate()} ${MONTHS[a.getMonth()]} — ${b.getDate()} ${MONTHS[b.getMonth()]} ${b.getFullYear()}`;
  el.innerHTML=`<div class="page-h"><div><div class="eyebrow">Планер</div><h1>Меню на неделю</h1><p>Планируйте завтраки, обеды и ужины, смотрите калории по дням и получайте готовый список покупок.</p></div></div>
  <div class="pl-h"><div style="display:flex;gap:8px;align-items:center"><button class="ibtn" onclick="weekNav(-1)">‹</button><b style="font-family:var(--serif);font-size:20px;min-width:230px;text-align:center">${title}</b><button class="ibtn" onclick="weekNav(1)">›</button><button class="btn sm" onclick="weekStart=monday(new Date());render()">Сегодня</button></div>
   <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="muted" style="font-size:13px">Едоков:</span><div class="stepper"><button onclick="setPeople(-1)">−</button><span>${S.people}</span><button onclick="setPeople(1)">+</button></div><button class="btn sm gold" onclick="autoFill()">✨ Заполнить неделю</button><button class="btn sm" onclick="clearWeek()">Очистить</button></div></div>
  <div class="week">${days.map((d,i)=>{const k=ymd(d);const pl=S.plan[k]||{};let kc=0;
    const slots=MEALS.map(([m,n,e])=>{const arr=pl[m]||[];arr.forEach(x=>{if(x.id){const r=byId(x.id);if(r)kc+=r.kcal}else kc+=x.k||0});
      return `<div class="slot"><div class="sh"><span>${e} ${n}</span><button onclick="planModal(null,'${k}','${m}')">＋</button></div>${arr.map((x,j)=>{const r=x.id?byId(x.id):null;return `<div class="pm"><a ${r?`onclick="go('#/r/${r.id}')"`:''}>${r?r.em+' '+esc(r.name):'📝 '+esc(x.note)}${r?`<small>${r.kcal} ккал</small>`:x.k?`<small>${x.k} ккал</small>`:''}</a><button onclick="planDel('${k}','${m}',${j})">✕</button></div>`}).join('')}</div>`}).join('');
    return `<div class="day ${k===today()?'today':''}"><h4>${DOW[i]}<small>${d.getDate()} ${MONTHS[d.getMonth()]}</small></h4>${slots}<div class="dsum">Итого: <b>${kc}</b> ккал</div></div>`}).join('')}</div>
  <div class="sec-h"><h2>🛒 Список покупок</h2><button class="btn sm" onclick="copyShop()">Скопировать</button></div><div class="panel" id="shop"></div>`;
  drawShop();
}
function weekNav(d){weekStart=addDays(weekStart,d*7);render()}
function setPeople(d){S.people=Math.max(1,Math.min(12,S.people+d));save('people');render()}
function planAdd(date,meal,item){const p=(S.plan[date]=S.plan[date]||{});(p[meal]=p[meal]||[]).push(item);save('plan')}
function planDel(d,m,j){S.plan[d][m].splice(j,1);save('plan');render()}
function planModal(rid,date,meal){
  if(rid){const days=[...Array(14)].map((_,i)=>addDays(new Date(),i));
    openModal('Добавить в планер',`<p class="muted" style="margin-bottom:12px">${esc(byId(rid).name)}</p><div class="frm"><label>День<select class="field" id="pd">${days.map(d=>`<option value="${ymd(d)}">${DOW[(d.getDay()+6)%7]}, ${d.getDate()} ${MONTHS[d.getMonth()]}</option>`).join('')}</select></label><label>Приём пищи<select class="field" id="pm">${MEALS.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join('')}</select></label></div><p style="margin-top:16px"><button class="btn gold" onclick="planConfirm('${rid}')">Добавить</button></p>`);return}
  openModal('Что приготовим?',`<input class="field" id="pq" placeholder="Поиск рецепта…" style="margin-bottom:10px"><div class="mlist" id="pl" style="max-height:44vh;overflow:auto"></div><div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:flex;gap:8px"><input class="field" id="pn" placeholder="Или заметка (например: ужин в ресторане)"><button class="btn sm" onclick="planNote('${date}','${meal}')">Добавить</button></div>`);
  const draw=q=>{$('#pl').innerHTML=searchRecipes(q).filter(r=>r.cat!=='sauce').slice(0,40).map(r=>`<button onclick="planPick('${date}','${meal}','${r.id}')"><span style="font-size:26px">${r.em}</span><div><b>${esc(r.name)}</b><br><small class="muted">${(CUISINES[r.cu]||{}).n} · ${r.kcal} ккал · ${r.t} мин</small></div></button>`).join('')};
  draw('');$('#pq').oninput=e=>draw(e.target.value);
}
function planConfirm(id){planAdd($('#pd').value,$('#pm').value,{id});closeModal();toast('Добавлено в планер 📅')}
function planPick(d,m,id){planAdd(d,m,{id});closeModal();render()}
function planNote(d,m){const n=$('#pn').value.trim();if(!n)return;planAdd(d,m,{note:n});closeModal();render()}
function clearWeek(){if(!confirm('Очистить всю неделю?'))return;for(let i=0;i<7;i++)delete S.plan[ymd(addDays(weekStart,i))];save('plan');render()}
function autoFill(){
  const pick=(cats,used)=>{const l=RECIPES.filter(r=>cats.includes(r.cat)&&!used.has(r.id));const pool=l.length?l:RECIPES.filter(r=>cats.includes(r.cat));return pool[Math.floor(Math.random()*pool.length)]};
  const used=new Set();
  for(let i=0;i<7;i++){const k=ymd(addDays(weekStart,i));S.plan[k]=S.plan[k]||{};
   [['b',['breakfast']],['l',['soup','salad','pasta','veg','fish']],['d',['meat','steak','fish','pasta','side']]].forEach(([m,c])=>{if(!(S.plan[k][m]||[]).length){const r=pick(c,used);if(r){used.add(r.id);S.plan[k][m]=[{id:r.id}]}}})}
  save('plan');render();toast('Неделя заполнена ✨ — поменяйте под себя');
}
function shopList(){
  const map={};
  for(let i=0;i<7;i++){const pl=S.plan[ymd(addDays(weekStart,i))]||{};
    Object.values(pl).flat().forEach(x=>{if(!x.id)return;const r=byId(x.id);if(!r)return;const k=S.people/r.serv;
      r.ing.forEach(g=>{const key=norm(g.n)+'|'+g.u;(map[key]=map[key]||{n:g.n,u:g.u,q:0}).q+=g.q*k})})}
  return Object.values(map).sort((a,b)=>a.n.localeCompare(b.n,'ru'));
}
function drawShop(){
  const l=shopList();const wk=ymd(weekStart);const ch=S.shop[wk]||[];
  $('#shop').innerHTML=l.length?`<ul class="shop">${l.map(i=>{const key=norm(i.n)+'|'+i.u;const d=ch.includes(key);return `<li class="${d?'done':''}" onclick="shopTick('${wk}',this.dataset.k)" data-k="${esc(key)}"><input type="checkbox" ${d?'checked':''}><span>${esc(i.n)}</span><b>${i.q?fq(i.q)+' '+i.u:'по вкусу'}</b></li>`}).join('')}</ul>`:'<div class="empty"><div class="e">🧺</div><p>Добавьте блюда в планер — список покупок соберётся автоматически.</p></div>';
}
function shopTick(wk,key){const a=S.shop[wk]=S.shop[wk]||[];const i=a.indexOf(key);if(i>=0)a.splice(i,1);else a.push(key);save('shop');drawShop()}
function copyShop(){const t=shopList().map(i=>'• '+i.n+(i.q?' — '+fq(i.q)+' '+i.u:'')).join('\n');if(!t){toast('Список пуст');return}navigator.clipboard?.writeText(t).then(()=>toast('Список скопирован 📋'),()=>toast('Не удалось скопировать'))}

/* ---------- ИЗБРАННОЕ ---------- */
function vFav(el){
  const l=S.fav.map(byId).filter(Boolean);
  el.innerHTML=`<div class="page-h"><div><div class="eyebrow">Избранное</div><h1>Мои рецепты</h1><p>Всё, что вы сохранили ❤️ — хранится на этом устройстве.</p></div></div><div style="margin-top:22px" class="grid">${l.map(card).join('')}</div>`+(l.length?'':`<div class="empty"><div class="e">❤️</div><p>Пока пусто. Нажмите ♡ на любом рецепте, чтобы сохранить.</p><p style="margin-top:14px"><a class="btn gold" href="#/recipes">Выбрать рецепт</a></p></div>`);
}

/* ---------- СТАРТ ---------- */
applyTheme();render();
</script></body></html>
