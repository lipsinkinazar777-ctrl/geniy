<style>

.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0;align-items:center}.row input{width:76px;text-align:center}.row select{max-width:340px}

$('#tsv').onclick=()=>{const amt=+$('#ta1').value;if(!(amt>0)){toast('Введи сумму');$('#ta1').focus();return}const acc=$('#tacc').value,to=$('#tto').value;if(ty==='tr'&&acc===to){toast('Выбери разные счета');return}const dt=$('#td').value||day(),dif=ty==='tr'&&acur(acc)!==acur(to),a2=+$('#ta2').value,o={type:ty,acc,to:ty==='tr'?to:'',amt,amt2:dif?(a2>0?a2:Math.round(conv(amt,acur(acc),acur(to))*100)/100):null,cat:ty==='tr'?'':(ct||'oth'),note:$('#tn').value.trim(),date:dt};if(n)S.tx.push({id:uid(),...o});else Object.assign(t,o);mm=dt.slice(0,7);touch();d.close();render(false);toast('Сохранено ✓')}})}
function accDlg(a){const ed=!!a;let ic=ed?a.icon:'🪙',bk=ed?(a.bank||''):'',cu=ed?a.c:dcode(),lastB=ed&&a.bank?(BK[a.bank]||[])[1]:'';
dlg(`<h2>${ed?esc(a.name):'Новый счёт'}</h2>${ed?`<p style="color:var(--mut);margin:0">Баланс: <b style="color:var(--ink)">${mc(bal(a),a.c)}</b></p>`:''}<label>Банк</label><div class="chips" id="bkc">${BANKS.map(b=>`<button class="chip ${b[0]===bk?'on':''}" data-b="${b[0]}"><i class="bk" style="background:${b[3]};color:${b[4]}">${b[2]}</i>${b[1]}</button>`).join('')}</div><label>Название</label><input id="an" value="${ed?esc(a.name):''}" placeholder="Например: Биржа"><label>Иконка</label><div class="chips" id="icc">${['🪙','💵','💳','🏦','💎','📈','🛍️'].map(e=>`<button class="chip ${!bk&&e===ic?'on':''}" data-e="${e}">${e}</button>`).join('')}</div><label>Валюта счёта</label><div class="chips" id="cuc">${CURS.map(c=>`<button class="chip ${c[0]===cu?'on':''}" data-cu="${c[0]}">${c[1]} ${c[0]}</button>`).join('')}</div>${ed?'<small style="color:var(--mut);display:block;margin-top:6px">Смена валюты не пересчитывает уже внесённые суммы</small>':''}<label id="lab"></label><input id="ab" type="number" step="0.01" value="${ed?(a.b||0):0}"><div class="acts">${ed?`<button class="btn d" id="adl">Удалить</button><button class="btn" id="afl">${ma===a.id?'Показать все':'Только этот счёт'}</button>`:''}<button class="btn" data-x>Отмена</button><button class="btn g" id="aok">${ed?'Сохранить':'Создать'}</button></div>`,d=>{
const lab=()=>$('#lab').textContent='Начальный баланс, '+C2S[cu],mark=()=>{d.querySelectorAll('[data-b]').forEach(x=>x.classList.toggle('on',x.dataset.b===bk));d.querySelectorAll('[data-e]').forEach(x=>x.classList.toggle('on',!bk&&x.dataset.e===ic));d.querySelectorAll('[data-cu]').forEach(x=>x.classList.toggle('on',x.dataset.cu===cu));lab()};
d.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const id=b.dataset.b;if(bk===id){bk='';mark();return}bk=id;const B=BK[id],n=$('#an');if(!n.value.trim()||n.value.trim()===lastB)n.value=B[1];lastB=B[1];if(!ed||!a.bank)cu=B[5];ic='💳';mark()});
d.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{ic=b.dataset.e;bk='';mark()});
d.querySelectorAll('[data-cu]').forEach(b=>b.onclick=()=>{cu=b.dataset.cu;mark()});
mark();if(!ed)$('#an').focus();
$('#aok').onclick=()=>{const nm=$('#an').value.trim();if(!nm){toast('Введи название');return}const o={name:nm,icon:ic,bank:bk,c:cu,b:+$('#ab').value||0};if(ed)Object.assign(a,o);else S.accts.push({id:uid(),...o});touch();d.close();render(false);toast(ed?'Сохранено ✓':'Счёт добавлен ✓')};
if(ed){$('#afl').onclick=()=>{ma=ma===a.id?'':a.id;d.close();render(false)};$('#adl').onclick=()=>{d.close();conf('Удалить счёт и все его операции?',()=>{S.accts=S.accts.filter(x=>x.id!==a.id);S.tx=S.tx.filter(t=>t.acc!==a.id&&t.to!==a.id);if(ma===a.id)ma='';touch();render(false)})}}})}
function accEdit(id){const a=S.accts.find(x=>x.id===id);if(a)accDlg(a)}
function ratesDlg(){dlg(`<h2>💱 Курсы валют</h2><p style="color:var(--mut);margin:0">Сколько единиц за 1 $ · ${S.ratesAt?'обновлено '+new Date(S.ratesAt).toLocaleString('ru-RU'):'стандартные / ручные значения'}${S.ratesManual?' · ручные':''}</p><div class="two" style="margin-top:6px">${CURS.filter(c=>c[0]!=='USD').map(c=>`<div><label>${c[1]} ${c[0]}</label><input type="number" step="0.0001" min="0" data-r="${c[0]}" value="${rt(c[0])}"></div>`).join('')}</div><small style="color:var(--mut);display:block;margin-top:12px">Остальные пары (€ ↔ ₴, £ ↔ € и т.д.) считаются через доллар. Курсы подтягиваются автоматически, если есть интернет.</small><div class="acts"><button class="btn" data-x>Отмена</button><button class="btn" id="rfr">Обновить онлайн</button><button class="btn g" id="rsv">Сохранить</button></div>`,d=>{
$('#rfr').onclick=async()=>{toast('Обновляю…');const ok=await fetchRates(true);if(ok){d.close();render(false);toast('Курсы обновлены ✓')}else toast('Нет связи — курсы не изменились')};
$('#rsv').onclick=()=>{d.querySelectorAll('[data-r]').forEach(i=>{const v=+i.value;if(v>0)S.rates[i.dataset.r]=v});S.ratesManual=true;touch();d.close();render(false);toast('Курсы сохранены ✓')}})}
async function fetchRates(force){if(S.ratesManual&&!force)return false;try{const r=await fetch('https://open.er-api.com/v6/latest/USD'),j=await r.json();if(!j||!j.rates)throw 0;CURS.forEach(c=>{if(j.rates[c[0]]>0)S.rates[c[0]]=j.rates[c[0]]});S.rates.USD=1;S.ratesAt=Date.now();if(force)S.ratesManual=false;touch();return true}catch(e){return false}}
$('#main').addEventListener('click',e=>{const b=e.target.closest('[data-mn]');if(!b||tab!=='money')return;const a=b.dataset.mn,id=b.dataset.id;
if(a==='prev'||a==='next'){mm=shiftM(mm,a==='next'?1:-1);render(true)}else if(a==='now'){mm=day().slice(0,7);render(true)}
else if(a==='tx'){if(!S.accts.length){toast('Сначала добавь счёт');return}txDlg({type:b.dataset.t||'out',acc:id||ma||S.accts[0].id,to:'',amt:'',cat:b.dataset.c||'',note:'',date:mm===day().slice(0,7)?day():mm+'-01'})}
else if(a==='edit')txDlg(S.tx.find(x=>x.id===id));else if(a==='zero')turnDlg();else if(a.startsWith('goal-'))goalAct(a,id,b);else if(a==='rates')ratesDlg();else if(a==='acc')accDlg();else if(a==='aedit')accEdit(id);else if(a==='gm'){mm=id;render(false)}
else if(a==='dacc')conf('Удалить счёт и все его операции?',()=>{S.accts=S.accts.filter(x=>x.id!==id);S.tx=S.tx.filter(t=>t.acc!==id&&t.to!==id);if(ma===id)ma='';touch();render(false)});
else if(a==='flt'){ma=ma===id?'':id;render(false)}else if(a==='all'){ma='';render(false)}});
$('#main').addEventListener('change',e=>{if(e.target.id==='cur'){S.cur=e.target.value;touch();render(false)}});
function exp(){dlg(`<h2>Экспорт</h2><p style="color:var(--mut);margin:0 0 10px">Скопируй и сохрани текст — потом его можно вставить через «Импорт».</p><textarea id="ta" rows="9" readonly>${esc(JSON.stringify(S))}</textarea><div class="acts"><button class="btn" data-x>Закрыть</button><button class="btn g" id="cp">Копировать</button></div>`,()=>$('#cp').onclick=()=>{const t=$('#ta');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}try{document.execCommand('copy')}catch(e){}toast('Скопировано ✓')})}
function imp(){dlg(`<h2>Импорт</h2><p style="color:var(--mut);margin:0 0 10px">Вставь ранее экспортированный текст. Текущие данные будут заменены.</p><textarea id="ta" rows="9"></textarea><div class="acts"><button class="btn" data-x>Отмена</button><button class="btn g" id="ok">Загрузить</button></div>`,d=>$('#ok').onclick=()=>{try{const v=JSON.parse($('#ta').value);if(!v.tasks||!v.habits)throw 0;S=v;S.xp=S.xp||0;S.ach=S.ach||{};S.qb=S.qb||{};fixS();S.theme=S.theme||'dark';d.close();persist();xpUI();render(true);toast('Импортировано ✓')}catch(e){toast('Неверные данные')}})}
$('#ex').onclick=exp;$('#im').onclick=imp;$('#sv').onclick=()=>{persist();toast('Сохранено ✓')};
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();persist();toast('Сохранено ✓')}});
function edit(id,sec){const t=id?S.tasks.find(x=>x.id===id):{title:'',note:'',sec,pri:'n',st:'todo',due:day(),proj:fj&&fj!=='-'?fj:''};
dlg(`<h2>Задача</h2><label>Название</label><input id="e1" value="${esc(t.title)}"><label>Заметка</label><textarea id="e2" rows="4">${esc(t.note)}</textarea>
<div class="two"><div><label>Раздел</label><select id="e3">${opt(SECS.map(s=>[s[0],s[0]]),t.sec)}</select></div><div><label>Приоритет</label><select id="e4">${opt(Object.entries(PRI),t.pri)}</select></div>
<div><label>Статус</label><select id="e5">${opt([['todo','К выполнению'],['done','Готово']],t.st)}</select></div><div><label>Срок</label><input type="date" id="e6" value="${t.due}"></div><div style="grid-column:1/-1"><label>Проект</label><select id="e7"><option value="">— без проекта —</option>${opt(S.projects.map(p=>[p.id,p.name]),t.proj)}</select></div></div>

<div class="acts">${id?'<button class="btn d" id="x1">Удалить</button>':''}<button class="btn" data-x>Отмена</button><button class="btn g" id="x3">Сохранить задачу</button></div>`,d=>{$('#e1').focus();
if(id)$('#x1').onclick=()=>{S.tasks=S.tasks.filter(x=>x.id!==id);touch();d.close();render(false)};
$('#x3').onclick=()=>{const v=$('#e1').value.trim();if(!v){$('#e1').focus();return}const n={id:id||uid(),title:v,note:$('#e2').value,sec:$('#e3').value,pri:$('#e4').value,st:$('#e5').value,due:$('#e6').value,proj:$('#e7').value};
if(n.st!==t.st){const k=day();S.doneLog[k]=Math.max(0,(S.doneLog[k]||0)+(n.st==='done'?1:-1))}
if(id)Object.assign(t,n);else S.tasks.push(n);touch();d.close();render(false)}})}
$('#date').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
$('#ttl').innerHTML='BOGDAN VERBNITSKY'.split('').map((c,i)=>`<span style="animation-delay:${1.5+i*.05}s">${c===' '?'&nbsp;':c}</span>`).join('');
for(let i=0;i<46;i++){const s=document.createElement('i');s.className='st';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*5}s;width:${2+Math.random()*4}px;height:${2+Math.random()*4}px`;$('#intro').append(s)}for(let i=0;i<16;i++){const c=document.createElement('div');c.className='coin';c.textContent='$';c.style.cssText=`left:${Math.random()*100}%;animation-duration:${4+Math.random()*5}s;animation-delay:${Math.random()*4}s;font-size:${14+Math.random()*28}px`;$('#intro').prepend(c)}
let opened=false;const open=()=>{if(opened)return;opened=true;$('#intro').classList.add('open');document.body.classList.add('ready');render(true);setTimeout(()=>$('#intro').remove(),1500)};
for(let i=0;i<4;i++){const e=document.createElement('i');e.className='sw';e.style.animationDelay=1+i*.55+'s';$('#intro').append(e)}
setTimeout(()=>{if(opened)return;const I=$('#intro'),cx=innerWidth/2,cy=innerHeight/2;for(let i=0;i<90;i++){const p=document.createElement('i');p.className='pt';const s=2+Math.random()*5;p.style.cssText=`left:${cx}px;top:${cy}px;width:${s}px;height:${s}px`;I.append(p);const a=Math.random()*6.283,d=120+Math.random()*Math.max(innerWidth,innerHeight)*.5;p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(0)`,opacity:0}],{duration:1600+Math.random()*1800,easing:'cubic-bezier(.1,.8,.3,1)',delay:Math.random()*300}).onfinish=()=>p.remove()}},900);
$('#intro').onclick=open;setTimeout(open,5200);ui();setNav();xpUI();checkAch(true);if(!S.ratesManual&&(!S.ratesAt||Date.now()-S.ratesAt>6*36e5))fetchRates().then(ok=>{if(ok&&tab==='money'&&!$('#dlg').open)render(false)});
</script></body></html>
