.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0;align-items:center}.row input{width:76px;text-align:center}.row select{max-width:340px}

/* напоминание о задачах со временем: всплывашка (и системное уведомление, если разрешено) в назначенную минуту */
function bnAlarm(){const k=day(),n=new Date(),c=n.getHours()*60+n.getMinutes();bnT().forEach(x=>{if(x.st==='done'||x.due!==k||!/^\d\d:\d\d$/.test(x.tm||'')||bnNo.has(x.id+x.tm))return;const[h,m]=x.tm.split(':').map(Number),t=h*60+m;if(c>=t&&c<t+15){bnNo.add(x.id+x.tm);toast('⏰ '+x.tm+' · '+x.title);try{if(window.Notification&&Notification.permission==='granted')new Notification(x.tm+' · '+x.title)}catch(e){}}})}
/* раз в полминуты: напоминания и обновление статусов «через …», пока не набираешь текст */
setInterval(()=>{bnAlarm();const a=document.activeElement;if(tab==='bin'&&!bns&&!bnd&&!document.hidden&&!$('#dlg').open&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render(false)},30000);
$('#date').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
$('#ttl').innerHTML='NAZAR KENTOV'.split('').map((c,i)=>`<span style="animation-delay:${1.5+i*.05}s">${c===' '?'&nbsp;':c}</span>`).join('');
for(let i=0;i<46;i++){const s=document.createElement('i');s.className='st';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*5}s;width:${2+Math.random()*4}px;height:${2+Math.random()*4}px`;$('#intro').append(s)}for(let i=0;i<16;i++){const c=document.createElement('div');c.className='coin';c.textContent='$';c.style.cssText=`left:${Math.random()*100}%;animation-duration:${4+Math.random()*5}s;animation-delay:${Math.random()*4}s;font-size:${14+Math.random()*28}px`;$('#intro').prepend(c)}
let opened=false;const open=()=>{if(opened)return;opened=true;$('#intro').classList.add('open');document.body.classList.add('ready');render(true);setTimeout(()=>$('#intro').remove(),1500)};
for(let i=0;i<4;i++){const e=document.createElement('i');e.className='sw';e.style.animationDelay=1+i*.55+'s';$('#intro').append(e)}
setTimeout(()=>{if(opened)return;const I=$('#intro'),cx=innerWidth/2,cy=innerHeight/2;for(let i=0;i<90;i++){const p=document.createElement('i');p.className='pt';const s=2+Math.random()*5;p.style.cssText=`left:${cx}px;top:${cy}px;width:${s}px;height:${s}px`;I.append(p);const a=Math.random()*6.283,d=120+Math.random()*Math.max(innerWidth,innerHeight)*.5;p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(0)`,opacity:0}],{duration:1600+Math.random()*1800,easing:'cubic-bezier(.1,.8,.3,1)',delay:Math.random()*300}).onfinish=()=>p.remove()}},900);
$('#intro').onclick=open;setTimeout(open,5200);ui();setNav();xpUI();checkAch(true);dockInit();if(!S.ratesManual&&(!S.ratesAt||Date.now()-S.ratesAt>6*36e5))fetchRates().then(ok=>{if(ok&&tab==='money'&&!$('#dlg').open)render(false)});
</script></body></html>
